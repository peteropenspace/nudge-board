name: Keep the board's database awake

# Free Supabase projects pause after a week with little activity. People using the
# board count as activity, so this is only insurance for holidays and quiet weeks.
# It makes one tiny, harmless database request twice a week.
#
# Setup: repository Settings > Secrets and variables > Actions > New repository secret
#   SUPABASE_URL   your project URL, like https://abcdefgh.supabase.co
#   SUPABASE_KEY   your publishable key (starts with sb_publishable_)
#
# Note: GitHub switches scheduled workflows off after 60 days without any commit in a
# public repository, and scheduled runs can be late. cron-job.org (free) can make the
# same request as a second safety net. See docs/SETUP.md, step 9.

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Make one small database request
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Add SUPABASE_URL and SUPABASE_KEY as repository secrets first."; exit 1
          fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/mute_by_token" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"00000000-0000-0000-0000-000000000000","p_mode":"off"}'
          echo
