name: Publish the board to GitHub Pages

# Only needed if you host on GitHub Pages (see docs/SETUP.md, step 7, option B).
# One-time: repository Settings > Pages > Build and deployment > Source = GitHub Actions.
# On a free GitHub plan the repository must be public. The board itself stays private
# because everyone has to sign in and the database checks the team list.

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
