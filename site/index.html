function timeAgo(ts){
  const m=Math.max(0,Math.round((NOW()-ts)/60000));
  if(m<1)return 'just now';if(m<60)return m+'m ago';
  const h=Math.round(m/60);if(h<24)return h+'h ago';
  return Math.round(h/24)+'d ago';
}

/* ----- the Supabase adapter. Everything the app needs from the server is here. ----- */
const SUPABASE_JS={
  src:'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js',
  integrity:'sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok'
};
function loadScript(src,integrity){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=src;
    if(integrity){s.integrity=integrity;s.crossOrigin='anonymous';}
    s.onload=res;s.onerror=()=>rej(new Error('Could not load the sign-in library. Check your connection and reload.'));
    document.head.appendChild(s);
  });
}
function makeSupabaseBackend(cfg){
  let sb=null;
  const ok=r=>{if(r.error)throw r.error;return r.data;};
  const PEOPLE_COLS='id,name,email,role,timezone,notify_mode,pm_instant,active,muted_until';
  return {
    async init(){
      await loadScript(SUPABASE_JS.src,SUPABASE_JS.integrity);
      sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
    },
    async session(){const {data}=await sb.auth.getSession();return data.session?{email:data.session.user.email}:null;},
    onAuth(cb){sb.auth.onAuthStateChange((ev,s)=>cb(ev,s?{email:s.user.email}:null));},
    async signInGoogle(){ok(await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}}));},
    async sendCode(email){ok(await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}}));},
    async verifyCode(email,token){ok(await sb.auth.verifyOtp({email,token,type:'email'}));},
    async signOut(){await sb.auth.signOut();},
    async whoami(){return ok(await sb.rpc('whoami'));},
    async rollIfDue(){return ok(await sb.rpc('roll_cycle_if_due'));},
    async rollNow(){return ok(await sb.rpc('roll_cycle_now'));},
    async loadAll(pm){
      const since=new Date(Date.now()-14*864e5).toISOString();
      const [board,team,cards,events,notes,history,people]=await Promise.all([
        sb.from('board').select('*').eq('id',1).single(),
        sb.from('team').select('id,name,role,timezone,active').order('name'),
        sb.from('cards').select('*').is('archived_at',null).order('num'),
        sb.from('card_events').select('card_key,title,from_status,to_status,actor_id,at').gte('at',since).order('at'),
        sb.from('notifications').select('id,card_id,kind,message,created_at,read_at').order('created_at',{ascending:false}).limit(40),
        sb.from('cycle_history').select('*').order('n'),
        pm?sb.from('people').select(PEOPLE_COLS).order('name'):Promise.resolve({data:null,error:null})
      ]);
      return {board:ok(board),team:ok(team),cards:ok(cards),events:ok(events),notes:ok(notes),history:ok(history),people:ok(people)};
    },
    async loadPeople(pm){
      const [team,people]=await Promise.all([
        sb.from('team').select('id,name,role,timezone,active').order('name'),
        pm?sb.from('people').select(PEOPLE_COLS).order('name'):Promise.resolve({data:null,error:null})
      ]);
      return {team:ok(team),people:ok(people)};
    },
    async cardsSince(iso){return ok(await sb.from('cards').select('*').gte('updated_at',iso));},
    async notesSince(iso){return ok(await sb.from('notifications').select('id,card_id,kind,message,created_at,read_at').gte('created_at',iso));},
    async insertCard(row){return ok(await sb.from('cards').insert(row).select().single());},
    async updateCard(id,patch,version){const d=ok(await sb.from('cards').update(patch).eq('id',id).eq('version',version).select());return d.length?d[0]:null;},
    async deleteCard(id){return ok(await sb.from('cards').delete().eq('id',id).select('id')).length>0;},
    async updateBoard(patch){ok(await sb.from('board').update(patch).eq('id',1));},
    async insertPerson(p){ok(await sb.from('people').insert(p));},
    async updatePerson(id,patch){const d=ok(await sb.from('people').update(patch).eq('id',id).select('id'));if(!d.length)throw new Error('That change was not allowed.');},
    async deletePerson(id){ok(await sb.from('people').delete().eq('id',id));},
    async getSettings(){return ok(await sb.from('notify_settings').select('*').eq('id',1).single());},
    async updateSettings(patch){ok(await sb.from('notify_settings').update(patch).eq('id',1));},
    async emailStatus(){return ok(await sb.rpc('email_status'));},
    async sendTestEmail(){return ok(await sb.rpc('send_test_email'));},
    async updateMyPrefs(mode,tz,pause){return ok(await sb.rpc('update_my_prefs',{p_notify_mode:mode,p_timezone:tz,p_pause:pause}));},
    async markNotesRead(){ok(await sb.from('notifications').update({read_at:new Date().toISOString()}).is('read_at',null));},
    async mute(token,mode){return ok(await sb.rpc('mute_by_token',{p_token:token,p_mode:mode}));},
    subscribe(h){
      const ch=sb.channel('nudge-board')
        .on('postgres_changes',{event:'*',schema:'public',table:'cards'},p=>h.card(p))
        .on('postgres_changes',{event:'*',schema:'public',table:'board'},()=>h.board())
        .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},p=>h.note(p.new))
        .subscribe(st=>h.status(st));
      return ()=>sb.removeChannel(ch);
    }
  };
}

/* ----- card <-> row ----- */
function rowFromCard(c){
  return {title:c.title,notes:c.notes||'',status:c.status,prio:c.prio,assignee_id:c.assigneeId||null,reviewer_id:c.reviewerId||null,
    due:c.due||null,tags:c.tags||[],checks:(c.checks||[]).map(k=>({t:k.t,done:!!k.done})),blocked:!!c.blocked};
}
function cardFromRow(r){
  const ts=x=>x?Date.parse(x):null;
  return {id:r.id,num:r.num,title:r.title,notes:r.notes||'',status:r.status,prio:r.prio,
    assignee:teamName(r.assignee_id),assigneeId:r.assignee_id||null,reviewerId:r.reviewer_id||null,
    due:r.due||'',tags:Array.isArray(r.tags)?r.tags:[],
    checks:(Array.isArray(r.checks)?r.checks:[]).filter(k=>k&&typeof k==='object').map(k=>({t:String(k.t==null?'':k.t),done:!!k.done})),blocked:!!r.blocked,
    rolled:r.rolled||0,created:ts(r.created_at),touched:ts(r.touched_at),statusSince:ts(r.status_since),doneAt:ts(r.done_at),version:r.version};
}
const cardSig=c=>JSON.stringify(rowFromCard(c))+'|'+c.touched;
const boardSig=()=>JSON.stringify([S.name,S.settings.cycleDays,S.settings.wip,S.settings.staleDays,S.reviewerId||null,S.timezone||'UTC']);
const boardPatch=()=>({name:S.name,cycle_days:S.settings.cycleDays,wip_limit:S.settings.wip,stale_days:S.settings.staleDays,
  default_reviewer_id:S.reviewerId||null,timezone:S.timezone||'UTC',updated_at:new Date().toISOString()});

const renderSoon=(function(){let t;return function(){clearTimeout(t);t=setTimeout(renderAll,120);};})();
const teamRefreshSoon=(function(){let t;return function(){clearTimeout(t);t=setTimeout(()=>{refreshPeople().catch(()=>{});},800);};})();

function applyLoaded(d){
  T.team=d.team;T.people=d.people;T.notes=d.notes;
  const b=d.board;
  S={v:1,name:b.name,key:b.card_prefix,nextNum:0,timezone:b.timezone,reviewerId:b.default_reviewer_id||null,
    settings:{cycleDays:b.cycle_days,wip:b.wip_limit,staleDays:b.stale_days},
    cycle:{n:b.cycle_n,start:b.cycle_start},
    history:d.history.map(h=>({n:h.n,start:h.start_date,end:h.end_date,done:h.done,total:h.total})),
    cards:d.cards.map(cardFromRow),
    log:d.events.filter(e=>e.actor_id===T.me.id).map(e=>({t:Date.parse(e.at),key:e.card_key,title:e.title,from:e.from_status||'',to:e.to_status})),
    sample:false};
  SYNC.last=new Map(S.cards.map(c=>[c.id,{sig:cardSig(c),version:c.version}]));
  SYNC.boardSig=boardSig();
  T.lastSeen=d.cards.reduce((m,r)=>(r.updated_at&&r.updated_at>m?r.updated_at:m),'')||new Date(Date.now()-60000).toISOString();
  T.noteSeen=d.notes.reduce((m,n)=>(n.created_at>m?n.created_at:m),'')||new Date(Date.now()-60000).toISOString();
}
async function reloadAll(opts){
  const discard=!!(opts&&opts.discard);
  if(!discard){clearTimeout(SYNC.timer);await pushChanges();}   // never throw away edits that are not saved yet
  const d=await B.loadAll(isPM());
  if(!discard&&dirty()){syncSoon();return;}                      // edits arrived while loading: keep them
  applyLoaded(d);T.fullAt=NOW();renderAll();
}

/* ----- saving: compare with what the server last told us and send only the differences ----- */
function syncSoon(){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushChanges,250);}
// Anything on screen that the server has not been told about yet?
function dirty(){
  if(S.cards.some(c=>{const k=SYNC.last.get(c.id);return !k||k.sig!==cardSig(c);}))return true;
  const present=new Set(S.cards.map(c=>c.id));
  for(const id of SYNC.last.keys())if(!present.has(id))return true;
  return isPM()&&boardSig()!==SYNC.boardSig;
}
function afterSave(c,r,sent){
  if(cardSig(c)===sent){                 // untouched while saving: take the server's copy
    Object.assign(c,cardFromRow(r));
    SYNC.last.set(c.id,{sig:cardSig(c),version:r.version});
  }else{                                 // edited again while saving: keep those edits and send them next round
    c.num=r.num;c.rolled=r.rolled||0;c.version=r.version;c.created=Date.parse(r.created_at);
    c.statusSince=Date.parse(r.status_since);c.doneAt=r.done_at?Date.parse(r.done_at):null;
    SYNC.last.set(c.id,{sig:sent,version:r.version});
    SYNC.again=true;
  }
  renderSoon();
}
function pushChanges(){
  if(!T.ready||!B)return Promise.resolve();
  if(SYNC.run){SYNC.again=true;return SYNC.run;}
  SYNC.run=(async()=>{
    try{
      do{
        SYNC.again=false;
        const present=new Set(S.cards.map(c=>c.id));
        for(const id of Array.from(SYNC.last.keys())){
          if(present.has(id))continue;
          const removed=await B.deleteCard(id);
          SYNC.last.delete(id);
          if(!removed){toast('Only the project manager or the person who added a card can delete it.');await reloadAll({discard:true});return;}
        }
        for(const c of S.cards.slice()){
          const known=SYNC.last.get(c.id);
          if(!known){
            const sent=cardSig(c);
            const r=await B.insertCard(Object.assign({id:c.id},rowFromCard(c)));
            afterSave(c,r,sent);
          }else if(known.sig!==cardSig(c)){
            const sent=cardSig(c);
            const r=await B.updateCard(c.id,rowFromCard(c),known.version);
            if(!r){toast('Someone just changed that card, so I refreshed the board.');await reloadAll({discard:true});return;}
            afterSave(c,r,sent);
          }
        }
        if(isPM()&&boardSig()!==SYNC.boardSig){await B.updateBoard(boardPatch());SYNC.boardSig=boardSig();}
      }while(SYNC.again);
    }catch(e){syncError(e);}
  })().then(()=>{SYNC.run=null;});
  return SYNC.run;
}
function syncError(e){
  console.error(e);
  const m=(e&&e.message)||'';
  let msg='That change did not save, so I refreshed the board.';
  if(/project manager|assign|reviewer/i.test(m))msg=m;
  else if((e&&e.code==='23514')||/check constraint|violates/i.test(m))msg='That change was not allowed. A title, note, tag or step was empty or too long. I refreshed the board.';
  toast(msg);
  reloadAll({discard:true}).catch(()=>{});
}

/* ----- changes made by other people ----- */
function onRemoteCard(p){
  if(p.eventType==='DELETE'){
    const id=p.old&&p.old.id;
    if(id){S.cards=S.cards.filter(c=>c.id!==id);SYNC.last.delete(id);renderSoon();}
    return;
  }
  const r=p.new;if(!r)return;
  const cur=S.cards.find(c=>c.id===r.id);
  if(r.archived_at){
    if(cur){S.cards=S.cards.filter(c=>c.id!==r.id);SYNC.last.delete(r.id);renderSoon();}
    return;
  }
  const known=SYNC.last.get(r.id);
  if(cur&&known){
    if(r.version<=known.version)return;        // our own echo, or old news
    if(cardSig(cur)!==known.sig)return;         // we have an unsaved edit; saving will sort it out
  }
  const fresh=cardFromRow(r);
  if((r.assignee_id&&!teamName(r.assignee_id))||(r.reviewer_id&&!teamName(r.reviewer_id)))teamRefreshSoon();
  if(r.updated_at&&(!T.lastSeen||r.updated_at>T.lastSeen))T.lastSeen=r.updated_at;
  if(cur)Object.assign(cur,fresh);else S.cards.push(fresh);
  SYNC.last.set(r.id,{sig:cardSig(cur||fresh),version:r.version});
  renderSoon();
}
function addNote(n){
  if(T.notes.some(x=>x.id===n.id))return;
  T.notes.unshift(n);T.notes=T.notes.slice(0,40);
  renderTools();setTitle();
  if(n.kind!=='update')toast(n.message);
}
function startLive(){
  try{
    T.unsub=B.subscribe({card:onRemoteCard,note:addNote,board:()=>{reloadAll().catch(()=>{});},status:st=>{
      const was=T.rt;T.rt=st==='SUBSCRIBED';
      if(T.rt&&!was&&T.rtEver)refreshTeam();     // reconnected: catch up on anything missed
      if(T.rt)T.rtEver=true;
    }});
  }catch(e){T.rt=false;}
  clearInterval(T.pollTimer);clearInterval(T.teamTimer);
  T.pollTimer=setInterval(()=>{pollOnce().catch(()=>{});},30000);
  T.teamTimer=setInterval(()=>{if(!document.hidden&&T.ready)refreshPeople().catch(()=>{});},5*60000);
}
async function pollOnce(){
  if(!T.ready||document.hidden||SYNC.run)return;
  const now=NOW();
  if(now-T.fullAt>(T.rt?15:5)*60000){await reloadAll();return;}   // also how removed cards are noticed
  if(T.rt)return;                                                 // live updates are arriving on their own
  const rows=await B.cardsSince(T.lastSeen);
  rows.forEach(r=>onRemoteCard({eventType:'UPDATE',new:r}));
  const ns=await B.notesSince(T.noteSeen);
  ns.forEach(n=>{if(n.created_at>T.noteSeen)T.noteSeen=n.created_at;addNote(n);});
}
async function refreshTeam(){
  if(!T.ready)return;
  try{await B.rollIfDue();await reloadAll();}catch(e){}
}
async function refreshPeople(){
  const d=await B.loadPeople(isPM());
  T.team=d.team;T.people=d.people;
  S.cards.forEach(c=>{if(c.assigneeId)c.assignee=teamName(c.assigneeId);});
  renderAll();
}

/* ----- the sign-in gate ----- */
function showGate(html){
  const g=$('#gate');g.innerHTML=html;g.hidden=false;
  const w=$('.wrap');if(w)w.inert=true;
  const f=g.querySelector('input,button');if(f)f.focus();
}
function hideGate(){
  const g=$('#gate');g.hidden=true;g.innerHTML='';
  const w=$('.wrap');if(w)w.inert=false;
}
const gateShell=inner=>'<div class="gate-card"><span class="kicker">Nudge Board</span>'+inner+'</div>';
function friendlyAuthError(err){
  const m=(err&&err.message)||String(err);
  if(/expired|invalid|otp/i.test(m))return 'That code did not work. Check the digits, or ask for a new one.';
  if(/rate|seconds|too many/i.test(m))return 'Please wait a minute before asking for another code.';
  if(/smtp|sending|authorized|confirmation/i.test(m))return 'The server could not send the email yet. Ask your project manager to check the email setup.';
  return m;
}
function showSignIn(msg,email){
  const g=CFG.google===true;
  showGate(gateShell('<h1>Sign in</h1><p class="muted">Use the email address your project manager added for you.</p>'+
    (g?'<button class="btn primary big" data-gate="google">Continue with Google</button><div class="or">or</div>':'')+
    '<div class="field"><label for="g-email">Email</label><input id="g-email" type="email" autocomplete="email" inputmode="email" placeholder="you@company.com" value="'+esc(email||'')+'"></div>'+
    '<button class="btn '+(g?'':'primary ')+'big" data-gate="send" id="g-send">Email me a code</button>'+
    '<div id="g-codebox" hidden><div class="field"><label for="g-code">Code from your email</label><input id="g-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456"></div>'+
    '<button class="btn primary big" data-gate="verify">Sign in</button></div>'+
    '<p id="g-msg" class="hint" role="status">'+esc(msg||'')+'</p>'));
}
$('#gate').addEventListener('click',async e=>{
  const b=e.target.closest('[data-gate]');if(!b)return;
  const a=b.dataset.gate,msg=$('#g-msg');
  const say=(t,bad)=>{if(msg){msg.textContent=t;msg.className='hint'+(bad?' badline':'');}};
  try{
    if(a==='google'){await B.signInGoogle();}
    else if(a==='send'){
      const email=$('#g-email').value.trim();
      if(!/^\S+@\S+\.\S+$/.test(email)){say('Enter your email address.',true);return;}
      b.disabled=true;say('Sending...');
      await B.sendCode(email);
      T.pendingEmail=email;$('#g-codebox').hidden=false;$('#g-code').focus();
      say('Check your inbox for the code. It can take a minute.');
      let n=60;const tm=setInterval(()=>{n--;b.textContent=n>0?'Send again in '+n+'s':'Send a new code';if(n<=0){clearInterval(tm);b.disabled=false;}},1000);
    }else if(a==='verify'){
      const code=$('#g-code').value.replace(/\s+/g,'');
      if(!code){say('Enter the code from your email.',true);return;}
      say('Checking...');
      await B.verifyCode(T.pendingEmail||$('#g-email').value.trim(),code);
      await enterBoard();
    }else if(a==='mute'){await applyMute(b.dataset.token,b.dataset.mode);}
    else if(a==='signout'){await B.signOut();location.reload();}
    else if(a==='reload'){location.reload();}
  }catch(err){b.disabled=false;say(friendlyAuthError(err),true);}
});
$('#gate').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const t=e.target;
  if(t.id==='g-email')$('#g-send')&&$('#g-send').click();
  else if(t.id==='g-code'){const v=$('#gate [data-gate="verify"]');v&&v.click();}
});

async function bootTeam(){
  T.on=true;
  showGate(gateShell('<h1>One moment</h1><p class="muted">Opening your board...</p>'));
  try{
    B=window.NUDGE_BACKEND||makeSupabaseBackend(CFG);
    await B.init();
  }catch(e){
    showGate(gateShell('<h1>Cannot reach the server</h1><p class="muted">'+esc(e.message||String(e))+'</p><button class="btn primary big" data-gate="reload">Try again</button>'));
    return;
  }
  if(/^#mute=/.test(location.hash)){await handleMuteLink();return;}
  B.onAuth((ev)=>{
    if(ev==='SIGNED_OUT'&&T.ready)location.reload();
    else if(ev==='SIGNED_IN'&&!T.ready&&!T.booting)enterBoard();
  });
  const sess=await B.session();
  if(!sess){showSignIn();return;}
  await enterBoard();
}
async function enterBoard(){
  if(T.booting||T.ready)return;
  T.booting=true;
  try{
    const sess=await B.session();
    const me=await B.whoami();
    if(!me){
      showGate(gateShell('<h1>Not on the team yet</h1><p class="muted">You are signed in as <b>'+esc(sess?sess.email:'')+'</b>, but that email is not on this board. Ask your project manager to add it, then reload.</p>'+
        '<button class="btn primary big" data-gate="reload">Reload</button><button class="btn big" data-gate="signout">Sign out</button>'));
      T.booting=false;return;
    }
    T.me=me;
    if(me.timezone!==T.tz){try{T.me=(await B.updateMyPrefs(null,T.tz,null))||me;}catch(e){}}
    try{await B.rollIfDue();}catch(e){}
    applyLoaded(await B.loadAll(T.me.role==='pm'));
    T.ready=true;T.fullAt=NOW();T.lastPoll=NOW();
    hideGate();renderAll();startLive();openDeepLink();
  }catch(e){
    console.error(e);
    showGate(gateShell('<h1>Something went wrong</h1><p class="muted">'+esc(e.message||String(e))+'</p><button class="btn primary big" data-gate="reload">Try again</button><button class="btn big" data-gate="signout">Sign out</button>'));
  }
  T.booting=false;
}
async function handleMuteLink(){
  const m=location.hash.match(/^#mute=([0-9a-f-]{36})&mode=(pause|calm|off)/i);
  history.replaceState(null,'',location.pathname+location.search);
  if(!m){
    showGate(gateShell('<h1>That link looks incomplete</h1><p class="muted">Open the board and use Settings to change your emails.</p><button class="btn primary big" data-gate="reload">Open the board</button>'));
    return;
  }
  const mode=m[2].toLowerCase();
  const label={pause:'Pause emails until Monday?',calm:'Switch to one digest each weekday morning?',off:'Turn emails off?'}[mode];
  showGate(gateShell('<h1>'+label+'</h1><p class="muted">You will still see every update in the board.</p>'+
    '<button class="btn primary big" data-gate="mute" data-token="'+esc(m[1])+'" data-mode="'+mode+'">Yes, do that</button>'+
    '<button class="btn big" data-gate="reload">No, open the board</button><p id="g-msg" class="hint" role="status"></p>'));
}
async function applyMute(token,mode){
  let html;
  try{
    const r=await B.mute(token,mode);
    if(!r||!r.ok)html='<h1>That link no longer works</h1><p class="muted">Open the board and use Settings to change your emails.</p>';
    else html='<h1>Done, '+esc(r.name)+'</h1><p class="muted">'+({pause:'No emails until Monday. You will still see updates in the board.',
      calm:'You will get one short digest each weekday morning, and no other emails.',off:'Emails are off. You will still see updates in the board.'})[r.mode]+'</p>';
  }catch(e){html='<h1>Could not save that</h1><p class="muted">'+esc(e.message||String(e))+'</p>';}
  showGate(gateShell(html+'<button class="btn primary big" data-gate="reload">Open the board</button>'));
}
function openDeepLink(){
  const m=location.hash.match(/^#card=(\d+)/);
  if(!m)return;
  const c=S.cards.find(x=>x.num===+m[1]);
  history.replaceState(null,'',location.pathname+location.search);
  if(c)openCard(c.id);else toast('That card is not on the board any more. It may have been archived.');
}

/* ----- notifications inbox ----- */
function notesHTML(){
  const rows=T.notes.map(n=>'<button type="button" class="note'+(n.read_at?'':' unread')+'" data-card="'+esc(n.card_id||'')+'"><span class="dot"></span><span class="msg">'+esc(n.message)+'</span><span class="when">'+timeAgo(Date.parse(n.created_at))+'</span></button>').join('');
  return head('Notifications')+'<div class="db">'+(rows||'<p class="muted" style="margin:0">Nothing yet. When a task lands with you, it shows up here first.</p>')+'</div>'+
    '<div class="df"><span class="hint">Emails only go out for things that need you, a few minutes after the change.</span><span class="grow"></span><button class="btn primary" data-act="close">Close</button></div>';
}
function openNotes(){
  openDialog('notes',notesHTML());
  if(T.notes.some(n=>!n.read_at)){
    const now=new Date().toISOString();
    T.notes.forEach(n=>{if(!n.read_at)n.read_at=now;});
    renderTools();setTitle();
    B.markNotesRead().catch(()=>{});
  }
}

/* ----- settings for a signed-in person ----- */
function exportText(){
  return JSON.stringify({board:{name:S.name,prefix:S.key,cycle:S.cycle,settings:S.settings},
    cards:S.cards.map(c=>Object.assign({num:c.num,owner:c.assignee,reviewer:teamName(c.reviewerId)},rowFromCard(c)))});
}
function teamSettingsHTML(){
  const s=S.settings,pm=isPM(),dis=pm?'':' disabled';
  const sel=(v,list)=>list.map(x=>'<option value="'+x[0]+'"'+(String(x[0])===String(v)?' selected':'')+'>'+x[1]+'</option>').join('');
  const paused=T.me.muted_until&&new Date(T.me.muted_until)>new Date();
  return head('Settings')+
    '<div class="db">'+
      '<div class="sec"><h3>Your emails</h3>'+
        '<div class="field"><label for="p-mode">How you hear about things</label><select id="p-mode">'+
          sel(T.me.notify_mode,[['normal','Normal: a short email when a task is with you'],['calm','Calm: one digest each weekday morning'],['off','No email: the bell in the app only']])+'</select></div>'+
        '<div class="row"><button class="btn small" data-act="pause-monday">Pause until Monday</button>'+(paused?'<button class="btn small" data-act="resume">Resume now</button><span class="hint">Paused until '+esc(new Date(T.me.muted_until).toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit'}))+'</span>':'')+'</div>'+
        '<span class="hint">Your time zone is '+esc(T.tz)+', taken from this browser. Emails only arrive 08:00 to 18:00 on weekdays there.</span></div>'+
      '<div class="sec"><h3>Board'+(pm?'':' (only the project manager can change these)')+'</h3><div class="grid2">'+
        '<div class="field"><label for="s-name">Board name</label><input id="s-name" value="'+esc(S.name)+'" maxlength="60"'+dis+'></div>'+
        '<div class="field"><label for="s-key">Card prefix</label><input id="s-key" class="mono" value="'+esc(S.key)+'" disabled></div>'+
        '<div class="field"><label for="s-len">Cycle length</label><select id="s-len"'+dis+'>'+sel(s.cycleDays,[[7,'1 week'],[14,'2 weeks'],[21,'3 weeks'],[28,'4 weeks']])+'</select></div>'+
        '<div class="field"><label for="s-wip">Doing limit</label><select id="s-wip"'+dis+'>'+sel(s.wip,[1,2,3,4,5,6,8,10].map(n=>[n,n+' card'+(n>1?'s':'')]))+'</select></div>'+
        '<div class="field"><label for="s-stale">Flag as quiet after</label><select id="s-stale"'+dis+'>'+sel(s.staleDays,[2,3,4,5,7].map(n=>[n,n+' days']))+'</select></div>'+
        '<div class="field"><label for="s-btz">Board time zone</label><input id="s-btz" list="tzlist" value="'+esc(S.timezone||'UTC')+'"'+dis+'><datalist id="tzlist">'+(typeof Intl.supportedValuesOf==='function'?Intl.supportedValuesOf('timeZone').map(z=>'<option value="'+z+'">').join(''):'')+'</datalist></div>'+
      '</div>'+(pm?'<div class="row"><button class="btn" data-act="roll-now">Start the next cycle now</button></div>':'')+'</div>'+
      (pm?'<div class="sec"><h3>Keep a copy</h3><span class="hint">The free database plan has no automatic backups. This copies a readable list of the cards on the board, for your records. It is not a one-click restore. For everything, export the tables as CSV from Supabase (Table Editor).</span>'+
        '<textarea id="s-export" class="mono-area" rows="3" readonly></textarea><div class="row"><button class="btn small" data-act="copy-export">'+ic('copy')+'Copy card list</button></div></div>':'')+
      '<div class="sec"><h3>Account</h3><div class="row"><span class="hint">Signed in as '+esc(T.me.email)+'</span><span class="grow"></span><button class="btn" data-act="sign-out">Sign out</button></div></div>'+
    '</div>';
}

/* ----- the project manager's team and email panel ----- */
function opt(v,cur,label){return '<option value="'+v+'"'+(v===cur?' selected':'')+'>'+label+'</option>';}
function personRow(p){
  const armed=T.armed===p.id;
  const paused=p.muted_until&&new Date(p.muted_until)>new Date();
  const pmEmail=p.role==='pm';
  return '<div class="prow'+(p.active?'':' off')+'" data-pid="'+p.id+'">'+
    '<input data-f="name" value="'+esc(p.name)+'" aria-label="Name" maxlength="80">'+
    '<input data-f="email" type="email" value="'+esc(p.email)+'" aria-label="Email"'+(pmEmail?' disabled title="To change a project manager\'s email, make them a member first, change it, then make them a PM again."':'')+'>'+
    '<select data-f="role" aria-label="Role">'+opt('member',p.role,'Member')+opt('pm',p.role,'PM')+'</select>'+
    '<button class="btn small'+(armed?' danger':'')+'" data-act="team-del" data-pid="'+p.id+'">'+(armed?'Really remove?':'Remove')+'</button>'+
    '<div class="sub2"><label class="chk"><input type="checkbox" data-f="active"'+(p.active?' checked':'')+'>Active</label>'+
      '<label class="chk">Emails <select data-f="notify_mode">'+opt('normal',p.notify_mode,'Normal')+opt('calm',p.notify_mode,'Digest only')+opt('off',p.notify_mode,'None')+'</select></label>'+
      (p.role==='pm'?'<label class="chk" title="Email me every move (not recommended)"><input type="checkbox" data-f="pm_instant"'+(p.pm_instant?' checked':'')+'>Email me every move</label>':'')+
      '<span class="muted">'+esc(p.timezone)+(paused?', paused':'')+'</span></div></div>';
}
function emailPanelHTML(){
  const s=T.settings,st=T.status;
  if(!s)return '<p class="muted" style="margin:0">Loading email settings...</p>';
  const base=s.app_url||(location.origin+location.pathname);
  return emailFieldsHTML(s,base)+'<div class="hint" id="e-status">'+statusHTML()+'</div>';
}
function statusHTML(){
  const st=T.status;let statusLine='';
  if(st){
    statusLine=''+(st.has_key?'<span class="okline">API key saved.</span>':'<span class="badline">No API key saved yet.</span> See step 6 in docs/SETUP.md.')+
      ' Sent today: '+st.sent_today+' of '+st.daily_cap+'.'+
      (st.last_at?' Last: '+esc(st.last_kind||'')+' to '+esc(st.last_to||'')+', '+esc(st.last_status||'')+(st.last_detail?' ('+esc(st.last_detail)+')':'')+'.':'');
  }
  return statusLine;
}
function emailFieldsHTML(s,base){
  return '<div class="row"><label class="chk"><input type="checkbox" id="e-enabled"'+(s.emails_enabled?' checked':'')+'><b>Send emails</b></label>'+
      '<span class="hint">Turn this off to stop all email at once. The bell keeps working.</span></div>'+
    '<div class="grid2 wide">'+
      '<div class="field"><label for="e-provider">Email service</label><select id="e-provider">'+opt('resend',s.provider,'Resend (needs your own domain)')+opt('brevo',s.provider,'Brevo')+opt('log',s.provider,'Log only (no sending)')+'</select></div>'+
      '<div class="field"><label for="e-fromname">From name</label><input id="e-fromname" value="'+esc(s.from_name)+'" maxlength="60"></div>'+
      '<div class="field"><label for="e-fromemail">From email</label><input id="e-fromemail" type="email" value="'+esc(s.from_email)+'" placeholder="board@yourcompany.com"></div>'+
      '<div class="field"><label for="e-appurl">Board web address</label><input id="e-appurl" value="'+esc(base)+'"></div>'+
    '</div>'+
    '<label class="chk"><input type="checkbox" id="e-hide"'+(s.hide_titles?' checked':'')+'>Keep card titles out of emails</label>'+
    '<div class="row"><button class="btn primary" data-act="team-save">Save email settings</button><button class="btn" data-act="team-test">Send me a test email</button><span id="e-msg" class="hint" role="status"></span></div>';
}
function emailPatch(){
  return {provider:$('#e-provider').value,from_name:$('#e-fromname').value.trim()||'Nudge Board',from_email:$('#e-fromemail').value.trim(),
    app_url:$('#e-appurl').value.trim(),hide_titles:$('#e-hide').checked,updated_at:new Date().toISOString()};
}
function teamHTML(){
  const rows=(T.people||[]).map(personRow).join('');
  const act=(T.people||[]).filter(p=>p.active);
  return head('Team and email')+'<div class="db">'+
    '<div class="sec"><h3>People</h3><span class="hint">Only people listed here can open the board. Give each person their name and work email. Only a PM can give tasks to other people.</span>'+
      '<div id="prows">'+rows+'</div>'+
      '<div class="addrow"><input id="t-name" placeholder="Name" aria-label="New person name" maxlength="80"><input id="t-email" type="email" placeholder="email@company.com" aria-label="New person email"><select id="t-role" aria-label="Role">'+opt('member','member','Member')+opt('pm','member','PM')+'</select><button class="btn primary" data-act="team-add">Add</button></div>'+
      '<span id="t-msg" class="hint" role="status"></span></div>'+
    '<div class="sec"><h3>Who reviews by default</h3><div class="field"><label for="t-rev">When a card reaches Review and has no reviewer</label><select id="t-rev"><option value="">The first project manager</option>'+
      act.map(p=>opt(p.id,S.reviewerId||'',esc(p.name))).join('')+'</select></div></div>'+
    '<div class="sec"><h3>Email</h3><div id="emailpanel">'+emailPanelHTML()+'</div></div>'+
  '</div><div class="df"><span class="hint">Emails wait 3 minutes before sending, skip weekends and nights, and never tell you about your own moves.</span><span class="grow"></span><button class="btn primary" data-act="close">Close</button></div>';
}
async function openTeam(){
  openDialog('team',teamHTML());
  try{
    const [s,st]=await Promise.all([B.getSettings(),B.emailStatus()]);
    T.settings=s;T.status=st;
    if(dlg.dataset.kind==='team'){const ep=$('#emailpanel');if(ep)ep.innerHTML=emailPanelHTML();}
  }catch(e){const ep=$('#emailpanel');if(ep)ep.innerHTML='<p class="badline" style="margin:0">'+esc(e.message||'Could not load email settings')+'</p>';}
}
function rerenderPeople(){
  const ae=document.activeElement,row=ae&&ae.closest?ae.closest('#prows .prow'):null;
  const keep=row?{pid:row.dataset.pid,f:ae.dataset.f,act:ae.dataset.act}:null;
  const el=$('#prows');if(el)el.innerHTML=(T.people||[]).map(personRow).join('');
  const rv=$('#t-rev');if(rv){const act=(T.people||[]).filter(p=>p.active);rv.innerHTML='<option value="">The first project manager</option>'+act.map(p=>opt(p.id,S.reviewerId||'',esc(p.name))).join('');}
  if(keep){
    const target=$('#prows .prow[data-pid="'+keep.pid+'"] '+(keep.f?'[data-f="'+keep.f+'"]':'[data-act="'+keep.act+'"]'));
    if(target)target.focus();
  }
}
function teamDialogChange(e){
  const el=e.target,id=el.id,kind=dlg.dataset.kind;
  if(kind==='team'){
    const row=el.closest&&el.closest('.prow');
    if(row&&el.dataset.f){
      const f=el.dataset.f;let v=el.type==='checkbox'?el.checked:el.value;
      if(f==='email')v=v.trim().toLowerCase();if(f==='name')v=v.trim();
      (async()=>{
        let failed=false;
        try{await B.updatePerson(row.dataset.pid,{[f]:v});}catch(err){failed=true;toast(err.message||'That change did not save.');}
        try{await refreshPeople();}catch(err){}
        if(failed||f==='role'||f==='active'||f==='email')rerenderPeople();
        if(row.dataset.pid===T.me.id){
          try{T.me=(await B.whoami())||T.me;}catch(err){}
          if(!isPM()){dlg.close();reloadAll({discard:true}).catch(()=>{});}
          renderTools();
        }
      })();
      return true;
    }
    if(id==='t-rev'){S.reviewerId=el.value||null;commit();return true;}
    if(id==='e-enabled'){
      (async()=>{
        const m=$('#e-msg'),patch=Object.assign(emailPatch(),{emails_enabled:el.checked});
        if(el.checked&&patch.provider!=='log'&&!patch.from_email){el.checked=false;if(m){m.textContent='Enter the From email first.';m.className='hint badline';}return;}
        try{await B.updateSettings(patch);Object.assign(T.settings,patch);if(m){m.textContent=el.checked?'Emails are on. Settings saved.':'Emails are off. Settings saved.';m.className='hint okline';}}
        catch(err){el.checked=!el.checked;if(m){m.textContent=err.message||'Could not change that.';m.className='hint badline';}}
      })();
      return true;
    }
  }
  if(kind==='settings'){
    if(id==='p-mode'){(async()=>{try{T.me=await B.updateMyPrefs(el.value,null,null)||T.me;toast('Saved.');}catch(err){toast(err.message||'Could not save.');}})();return true;}
    if(id==='s-btz'){S.timezone=el.value.trim()||'UTC';commit();return true;}
  }
  return false;
}
function teamDialogClick(kind,a,act,e){
  if(kind==='notes'){
    const n=e.target.closest('.note');
    if(n&&n.dataset.card&&cardById(n.dataset.card)){dlg.close();openCard(n.dataset.card);return true;}
    return false;
  }
  if(kind==='team'){
    if(a==='team-add'){
      const name=$('#t-name').value.trim(),email=$('#t-email').value.trim().toLowerCase(),role=$('#t-role').value,m=$('#t-msg');
      if(!name||!/^\S+@\S+\.\S+$/.test(email)){m.textContent='Enter a name and a work email.';m.className='hint badline';return true;}
      (async()=>{
        try{
          await B.insertPerson({name,email,role,timezone:T.tz});
          $('#t-name').value='';$('#t-email').value='';
          await refreshPeople();rerenderPeople();
          m.textContent=name+' can now sign in with '+email+'.';m.className='hint okline';
        }catch(err){m.textContent=/duplicate|unique/i.test(err.message||'')?'That email is already on the team.':(err.message||'Could not add that person.');m.className='hint badline';}
      })();
      return true;
    }
    if(a==='team-del'){
      const id=act.dataset.pid;
      if(T.armed!==id){T.armed=id;rerenderPeople();return true;}
      T.armed=null;
      (async()=>{try{await B.deletePerson(id);}catch(err){toast(err.message||'Could not remove that person.');}try{await refreshPeople();rerenderPeople();}catch(err){}})();
      return true;
    }
    if(a==='team-save'){
      const m=$('#e-msg');
      const patch=emailPatch();
      (async()=>{
        try{await B.updateSettings(patch);Object.assign(T.settings,patch);m.textContent='Saved.';m.className='hint okline';}
        catch(err){m.textContent=err.message||'Could not save.';m.className='hint badline';}
      })();
      return true;
    }
    if(a==='team-test'){
      const m=$('#e-msg');m.textContent='Sending...';m.className='hint';
      (async()=>{
        try{
          const r=await B.sendTestEmail();
          m.textContent=r.message;m.className='hint '+(r.ok?'okline':'badline');
          setTimeout(async()=>{try{T.status=await B.emailStatus();const st=$('#e-status');if(dlg.dataset.kind==='team'&&st)st.innerHTML=statusHTML();}catch(err){}},70000);
        }catch(err){m.textContent=err.message||'Could not send.';m.className='hint badline';}
      })();
      return true;
    }
  }
  if(kind==='settings'){
    if(a==='pause-monday'||a==='resume'){
      (async()=>{try{T.me=await B.updateMyPrefs(null,null,a==='resume'?'clear':'monday')||T.me;openDialog('settings',settingsHTML());$('#s-export')&&($('#s-export').value=exportText());}catch(err){toast(err.message||'Could not save.');}})();
      return true;
    }
    if(a==='sign-out'){(async()=>{try{await B.signOut();}catch(err){}location.reload();})();return true;}
    if(a==='roll-now'){
      (async()=>{try{await B.rollNow();await reloadAll();toast('New cycle started. Unfinished cards rolled over.');dlg.close();}catch(err){toast(err.message||'Could not start a new cycle.');}})();
      return true;
    }
    if(a==='copy-export'){
      copyText($('#s-export').value).then(ok=>{act.lastChild.textContent=ok?'Copied':'Select and copy';setTimeout(()=>{act.lastChild.textContent='Copy card list';},1400);});
      $('#s-export').select();return true;
    }
  }
  return false;
}

/* ---------- boot ---------- */
const narrow=window.matchMedia('(max-width:640px)');
const setPlaceholder=()=>{$('#add').placeholder=narrow.matches?'Add a task, e.g. Fix login fri !high':'Add a task: Fix login timeout fri !high @sam #auth';};
setPlaceholder();
if(narrow.addEventListener)narrow.addEventListener('change',setPlaceholder);
if(TEAM_CONFIGURED){
  S=blankState();S.cards=[];
  bootTeam();
}else{
  S=load()||sampleState();
  const rolled=autoRoll();
  save();
  renderAll();
  if(rolled)toast('Cycle '+S.cycle.n+' started. '+rolled.done+' done archived, '+rolled.rolled+' rolled over.');
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){T.hiddenAt=NOW();return;}
  if(T.on){if(T.ready&&NOW()-(T.hiddenAt||NOW())>5*60000)refreshTeam();return;}
  const r=autoRoll();
  if(r){save();toast('Cycle '+S.cycle.n+' started. '+r.done+' done archived, '+r.rolled+' rolled over.');}
  if(!dlg.open)renderAll();
});
window.addEventListener('hashchange',()=>{if(T.on&&T.ready)openDeepLink();});
})();
</script>
</body>
