<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nudge Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: masthead (board name, cycle pulse, tools) > one quick-add line > five status columns that sort themselves by focus score; the Focus tab lists what to do next and what is due. */
:root{
  --bg:#E7EDEB; --col:#F1F5F3; --surface:#FFFFFF; --chip:#E6ECEA;
  --ink:#12201D; --ink2:#42544F; --ink3:#66776F; --line:#D2DBD8; --line2:#E4EAE8;
  --accent:#0F766E; --accent-ink:#FFFFFF; --accent-soft:#D5EEE9;
  --warn:#94500A; --warn-soft:#FAEBCF; --bad:#B0302A; --bad-soft:#FADCD8;
  --shadow:0 1px 2px rgba(18,32,29,.07);
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1311; --col:#121B18; --surface:#18231F; --chip:#233029;
    --ink:#E5EEEB; --ink2:#AEBFBA; --ink3:#83958F; --line:#2A3A35; --line2:#22302B;
    --accent:#3FCDB6; --accent-ink:#06211C; --accent-soft:#12403A;
    --warn:#EBAA4B; --warn-soft:#3B2C12; --bad:#F2796B; --bad-soft:#42201C;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1311; --col:#121B18; --surface:#18231F; --chip:#233029;
  --ink:#E5EEEB; --ink2:#AEBFBA; --ink3:#83958F; --line:#2A3A35; --line2:#22302B;
  --accent:#3FCDB6; --accent-ink:#06211C; --accent-soft:#12403A;
  --warn:#EBAA4B; --warn-soft:#3B2C12; --bad:#F2796B; --bad-soft:#42201C;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink3)}
.grow{flex:1 1 auto}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:14px 64px}
.ic{width:16px;height:16px;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.small{height:26px;padding:0 9px;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.iconbtn{display:inline-grid;place-items:center;width:28px;height:28px;border:0;background:none;border-radius:6px;color:var(--ink3);flex:none}
.iconbtn:hover{background:var(--chip);color:var(--ink)}
.iconbtn.sm{width:24px;height:24px}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--surface);font:600 11px/1 var(--f-mono)}

/* masthead */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 32px;padding-bottom:14px}
.brand{display:flex;flex-direction:column;gap:5px;min-width:0}
.brand .kicker{font:600 11px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.brand h1{margin:0;font:700 26px/1.05 var(--f-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.pulse{display:flex;flex-direction:column;gap:7px;flex:1 1 280px;max-width:440px;min-width:0}
.pl-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.cy{font:700 13px/1 var(--f-display)}
.bar{position:relative;height:8px;border-radius:99px;background:var(--line)}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:99px}
.bar .b-done{background:var(--accent)}
.bar .b-fly{background:color-mix(in srgb,var(--accent) 38%,transparent);border-radius:0 99px 99px 0}
.bar .tick{top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--ink)}
.pl-bot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;background:var(--chip);color:var(--ink2);font-weight:650;font-size:11.5px}
.pill.good{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}

/* quick add */
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;height:46px;padding:0 15px;font-size:15.5px;border:1px solid var(--line);background:var(--surface);border-radius:10px;box-shadow:var(--shadow)}
.add input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.add .btn{height:46px;padding-inline:16px}
.preview{min-height:30px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:9px 2px 2px;color:var(--ink3);font-size:12.5px}
.preview kbd,.help kbd{font:500 11px/1 var(--f-mono);padding:2px 5px;border-radius:4px;background:var(--chip);color:var(--ink2)}

.notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);margin-top:8px;font-size:13px}
.notice.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.notice .btn{margin-left:auto}
.notice.warn .btn{background:transparent;border-color:currentColor;color:inherit}

/* view bar */
.viewbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:16px 0 10px}
.tabs{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px}
.tab{border:0;background:none;height:28px;padding:0 13px;border-radius:7px;font-weight:600;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:9px;color:var(--ink3);pointer-events:none}
.search input{height:30px;width:190px;max-width:100%;padding:0 10px 0 30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.who{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid transparent;background:none;display:inline-grid;place-items:center}
.who.on{border-color:var(--accent)}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:600 10px/1 var(--f-body);color:#fff;flex:none}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border:0;border-radius:5px;background:var(--chip);color:var(--ink2);font:500 11px/1 var(--f-mono);white-space:nowrap}
.chip .ic{width:11px;height:11px}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--accent-soft);color:var(--accent)}
button.chip:hover{filter:brightness(.96)}
button.chip.on{background:var(--accent);color:var(--accent-ink)}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(232px,1fr));gap:12px;overflow-x:auto;padding:3px 3px 12px;margin-inline:-3px;align-items:start;scroll-snap-type:x proximity}
.col{scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;min-width:0;padding:8px;border-radius:12px;background:var(--col)}
.col.backlog{background:transparent;border:1px dashed var(--line)}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.chead{display:flex;align-items:center;gap:8px;padding:3px 4px 0}
.chead h2{margin:0;font:650 12px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.count{font:500 11.5px/1 var(--f-mono);color:var(--ink3)}
.count.over{color:var(--warn);font-weight:600}
.sub{margin:0;padding:0 4px;font-size:12px;color:var(--ink3)}
.sub.warn{color:var(--warn)}
.cards{display:flex;flex-direction:column;gap:8px;min-height:24px}
.empty{padding:14px 8px;text-align:center;font-size:12.5px;color:var(--ink3)}
.card{display:flex;flex-direction:column;gap:7px;min-width:0;padding:10px 10px 9px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);cursor:pointer}
.card:hover{border-color:var(--ink3)}
.card.dragging{opacity:.4}
.card.is-blocked .ctitle{color:var(--ink3)}
.ctop{display:flex;align-items:center;gap:7px;min-width:0}
.key{font:500 11px/1 var(--f-mono);color:var(--ink3);white-space:nowrap}
.ctitle{font-weight:560;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.cmeta{display:flex;flex-wrap:wrap;gap:5px}
.prio{display:inline-flex;align-items:center;gap:2px;color:var(--ink3)}
.prio b{font:700 11px/1 var(--f-mono)}
.prio.p4{color:var(--bad)}
.prio.p3{color:var(--warn)}
.pi{width:13px;height:13px}
.ringbtn{padding:4px;margin:-4px;border:0;background:none;border-radius:50%;display:inline-grid;flex:none}
.ring{--p:0%;--rc:var(--ink3);width:18px;height:18px;padding:2px;border:2px solid var(--rc);border-radius:50%;background:conic-gradient(var(--rc) var(--p),transparent 0) content-box;display:grid;place-items:center}
.ringbtn:hover .ring{--rc:var(--accent)}
.ring[data-s="backlog"]{border-style:dashed}
.ring[data-s="doing"]{--p:50%;--rc:var(--accent)}
.ring[data-s="review"]{--p:75%;--rc:var(--accent)}
.ring[data-s="done"]{background:var(--accent);border-color:var(--accent);padding:0}
.ring svg{width:10px;height:10px;stroke:var(--accent-ink);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* focus view */
.focus{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel h2{margin:0;padding:13px 16px 4px;font:700 15px/1.2 var(--f-display)}
.panel .lede{margin:0;padding:0 16px 10px;font-size:12.5px;color:var(--ink3)}
.panel h3{margin:0;padding:10px 16px 6px;font:650 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border-top:1px solid var(--line2)}
.list{list-style:none;margin:0;padding:0}
.frow,.drow{display:grid;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line2);cursor:pointer}
.frow{grid-template-columns:22px minmax(0,1fr) auto}
.drow{grid-template-columns:52px minmax(0,1fr) auto}
.frow:hover,.drow:hover{background:var(--col)}
.rank{font:600 13px/1 var(--f-mono);color:var(--ink3)}
.ftitle{font-weight:560;overflow-wrap:anywhere}
.why{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.dd{font:600 12px/1.2 var(--f-mono);color:var(--ink2)}
.fempty{padding:14px 16px;color:var(--ink3);font-size:13px;border-top:1px solid var(--line2)}

/* dialogs */
dialog{width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.28);overflow:auto}
dialog::backdrop{background:rgba(8,16,14,.55)}
.dh{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line2)}
.dh h2{margin:0;font:700 17px/1.2 var(--f-display)}
.dh .muted{font-size:12.5px;min-width:0}
.dh .iconbtn{margin-left:auto}
.db{display:flex;flex-direction:column;gap:14px;padding:16px 18px}
.df{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line2)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font:600 11px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
input,select,textarea{min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
textarea{resize:vertical;line-height:1.4}
.title-input{font:650 18px/1.3 var(--f-body);padding:9px 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.hint{font-size:12px;color:var(--ink3)}
.hint.warn{color:var(--warn)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.check{display:flex;align-items:center;gap:8px;padding:3px 0}
.check label{flex:1;min-width:0;overflow-wrap:anywhere}
.check label.done{color:var(--ink3);text-decoration:line-through}
.toggle{display:flex;align-items:center;gap:8px;font-weight:500}
input[type="checkbox"]{width:16px;height:16px;padding:0;accent-color:var(--accent)}
.ci{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:1px solid var(--line2)}
.ci:first-child{border-top:0;padding-top:0}
.ci-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.ci-title{font-weight:600;overflow-wrap:anywhere}
.gitrow{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line2)}
.gitrow .grow{min-width:0}
.gitrow code,.code{font:12px/1.5 var(--f-mono);color:var(--ink2);overflow-wrap:anywhere}
.mono-area{font:12.5px/1.5 var(--f-mono)}
.help h3{margin:4px 0 8px;font:650 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.help ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:9px 10px 9px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .btn{background:transparent;color:inherit;border-color:currentColor}

/* team mode */
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.gate-card{width:min(420px,100%);display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px}
.gate-card h1{margin:0;font:700 26px/1.1 var(--f-display);letter-spacing:-.02em}
.gate-card p{margin:0}
.gate .kicker{font:600 11px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.gate .big{height:42px;justify-content:center;font-size:14px}
.gate .or{text-align:center;color:var(--ink3);font-size:12px}
.whochip{display:inline-grid;place-items:center;width:32px;height:32px;border:0;background:none;padding:0}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.prow:first-of-type{border-top:0}
.grid2.wide{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.prow .sub2{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12.5px;color:var(--ink2)}
.prow.off{opacity:.6}
.sec{display:flex;flex-direction:column;gap:10px}
.sec+.sec{padding-top:14px;border-top:1px solid var(--line2)}
.sec h3{margin:0;font:700 14px/1.2 var(--f-display)}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto auto;gap:8px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:6px}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2);cursor:pointer}
.note:first-child{border-top:0}
button.note{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line2);font:inherit;color:inherit;padding:10px 0}
button.note:first-child{border-top:0}
.note .msg{display:block}
.note .dot{flex:none;width:8px;height:8px;margin-top:6px;border-radius:50%;background:transparent}
.note.unread .dot{background:var(--accent)}
.note.unread .msg{font-weight:600}
.note .when{font:500 11px/1.4 var(--f-mono);color:var(--ink3);white-space:nowrap}
.note .msg{min-width:0;overflow-wrap:anywhere}
.okline{color:var(--accent);font-weight:600}
.badline{color:var(--bad);font-weight:600}
@media (max-width:860px){.focus{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.prow,.addrow{grid-template-columns:minmax(0,1fr) auto}.prow input[type=email],.addrow input[type=email]{grid-column:1 / -1}}
@media (max-width:640px){
  .board{grid-template-columns:repeat(5,84vw)}
  .tools .lbl-t{display:none}
  .tools .btn{padding:0 9px}
  .brand h1{font-size:23px}
  .preview.idle{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="kicker">Nudge Board</span>
      <h1 id="boardName">Board</h1>
    </div>
    <div class="pulse" id="pulse"></div>
    <div class="tools">
      <button class="iconbtn" id="btnBell" data-act="open-notes" title="Notifications" aria-label="Notifications" hidden></button>
      <button class="btn" id="btnTeam" data-act="open-team" title="People and email settings" hidden></button>
      <button class="btn" id="btnCheckin" data-act="open-checkin" title="Check in (c)"></button>
      <button class="btn" data-act="open-git" title="Update cards from git activity (g)"></button>
      <button class="btn" data-act="open-standup" title="Write my standup (s)"></button>
      <button class="iconbtn" data-act="open-settings" title="Settings" aria-label="Settings"></button>
      <button class="iconbtn" data-act="open-help" title="Help and shortcuts (?)" aria-label="Help and shortcuts"></button>
      <button class="whochip" id="whoChip" data-act="open-settings" hidden></button>
    </div>
  </header>

  <div class="add">
    <input id="add" type="text" maxlength="1000" autocomplete="off" spellcheck="false" placeholder="Add a task: Fix login timeout fri !high @sam #auth" aria-label="Add a task">
    <button class="btn primary" id="addBtn" data-act="add">Add</button>
  </div>
  <div class="preview" id="preview"></div>
  <div id="notices"></div>

  <div class="viewbar">
    <div class="tabs" role="tablist" aria-label="View">
      <button class="tab" role="tab" id="tab-board" data-view="board" aria-selected="true">Board</button>
      <button class="tab" role="tab" id="tab-focus" data-view="focus" aria-selected="false">Focus</button>
    </div>
    <label class="search"><span id="searchIc"></span><input id="q" type="search" placeholder="Filter cards" aria-label="Filter cards" autocomplete="off"></label>
    <div class="chips" id="filters"></div>
  </div>

  <main id="board" class="board" aria-label="Board"></main>
  <main id="focus" class="focus" hidden aria-label="Focus"></main>
</div>

<div id="gate" class="gate" hidden></div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const pad=n=>String(n).padStart(2,'0');
const DAY=864e5;
const NOW=()=>Date.now();

/* dates are local YYYY-MM-DD strings */
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);};
const diffDays=(a,b)=>Math.round((parseISO(b)-parseISO(a))/DAY);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WDL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtDate=s=>{const d=parseISO(s);return MON[d.getMonth()]+' '+d.getDate();};
const daysSince=ts=>Math.max(0,Math.floor((NOW()-ts)/DAY));
const ago=ts=>{const d=daysSince(ts);return d<1?'today':d+'d ago';};
function dueLabel(s){
  const d=diffDays(today(),s);
  if(d<0)return (-d)+'d overdue';
  if(d===0)return 'Today';
  if(d===1)return 'Tomorrow';
  if(d<7)return WD[parseISO(s).getDay()];
  return fmtDate(s);
}

    const before=cardMap();

const keyOf=c=>S.key+'-'+(c.num||'...');

function branchName(c){

function setStatus(c,to){
  if(c.status===to)return;
  const from=c.status,now=NOW();
  c.status=to;c.statusSince=now;c.touched=now;
  if(to==='done'){c.doneAt=now;c.blocked=false;}else c.doneAt=null;
  if(to==='backlog')c.rolled=0;
  S.log.push({t:now,key:keyOf(c),title:c.title,from:from,to:to});
  if(S.log.length>400)S.log=S.log.slice(-400);
}
function isStale(c){
  return (c.status==='doing'||c.status==='review')&&!c.blocked&&daysSince(c.touched)>=S.settings.staleDays;
}
/* Priority follows the deadline: a close due date raises the shown priority on its own. */
function effPrio(c){
  const base=PN[c.prio];let n=base,why='';
  if(c.due&&c.status!=='done'){
    const d=diffDays(today(),c.due);
    const floor=d<=1?4:d<=3?3:d<=7?2:0;
    if(floor>n){n=floor;why=d<0?'overdue':d===0?'due today':'due in '+d+'d';}
  }
  return {n:n,bumped:n>base,why:why};
}
function score(c){
  const e=effPrio(c);let s=e.n*20;
  if(c.due){
    const d=diffDays(today(),c.due);
    s+=d<0?60+Math.min(-d,10)*2:d===0?50:d<=2?35:d<=5?20:d<=10?8:0;
  }
  if(c.status==='review')s+=14;else if(c.status==='doing')s+=10;
  s+=Math.min(c.rolled,3)*4;
  if(isStale(c))s+=6;
  if(c.blocked)s-=100;
  return s;
}
function reasons(c){
  const r=[];
  if(c.due){
    const d=diffDays(today(),c.due);
    if(d<0)r.push(['Overdue '+(-d)+'d','bad']);
    else if(d<=3)r.push([d===0?'Due today':d===1?'Due tomorrow':'Due in '+d+'d',d<=1?'bad':'warn']);
    else if(d<=10)r.push(['Due '+fmtDate(c.due),'']);
  }
  if(c.status==='review')r.push(['In review: finish it','good']);
  else if(c.status==='doing')r.push(['Started '+(daysSince(c.statusSince)<1?'today':daysSince(c.statusSince)+'d ago'),'']);
  if(isStale(c))r.push(['Quiet '+daysSince(c.touched)+'d','warn']);
  if(c.rolled)r.push(['Rolled over x'+c.rolled,'']);
  if(!r.length)r.push([PBYN[PN[c.prio]].name+' priority','']);
  return r;
}
function advance(c,dir){
  const i=ORDER.indexOf(c.status);
  let j=c.status==='done'&&dir>0?ORDER.indexOf('doing'):clamp(i+dir,0,ORDER.length-1);
  if(j===i)return;
  mutate(()=>setStatus(c,ORDER[j]),keyOf(c)+' moved to '+SNAME[ORDER[j]]);
}

/* ---------- cycles ---------- */
function rollCycle(newStart,bump){
  const done=S.cards.filter(c=>c.status==='done');
  const open=S.cards.filter(c=>c.status==='todo'||c.status==='doing'||c.status==='review');
  const nominal=addDays(S.cycle.start,S.settings.cycleDays-1),yest=addDays(newStart,-1);
  S.history.push({n:S.cycle.n,start:S.cycle.start,end:nominal<yest?nominal:yest,done:done.length,total:done.length+open.length});
  S.history=S.history.slice(-12);
  S.cards=S.cards.filter(c=>c.status!=='done');
  open.forEach(c=>{c.rolled=(c.rolled||0)+1;});
  S.cycle={n:S.cycle.n+bump,start:newStart};
  return {done:done.length,rolled:open.length};
}
function autoRoll(){
  if(T.on)return null;
  const len=S.settings.cycleDays,el=diffDays(S.cycle.start,today());
  if(el<len)return null;
  const k=Math.floor(el/len);
  return rollCycle(addDays(S.cycle.start,k*len),k);
}

/* ---------- quick add parsing ---------- */
function parseQuick(raw){
  let s=' '+raw+' ';
  const r={prio:null,assignee:'',tags:[],due:'',status:''};
  s=s.replace(/\s!(urgent|high|medium|med|low|[1-4])(?=\s)/gi,(m,v)=>{
    v=v.toLowerCase();
    r.prio={'1':'urgent','2':'high','3':'med','4':'low',urgent:'urgent',high:'high',medium:'med',med:'med',low:'low'}[v];return ' ';
  });
  s=s.replace(/\s>(backlog|todo|doing|review|done)(?=\s)/gi,(m,v)=>{r.status=v.toLowerCase();return ' ';});
  s=s.replace(/\s@([\w.-]+)(?=\s)/g,(m,v)=>{r.assignee=cleanName(v);return ' ';});
  s=s.replace(/\s#([a-z][\w-]*)(?=\s)/gi,(m,v)=>{r.tags.push(v.toLowerCase());return ' ';});
  const t=today(),dow=new Date().getDay();
  const P='(?:\\s+(?:by|due|on|until|before))?\\s+';
  const tryDate=(src,fn)=>{
    if(r.due)return;
    const re=new RegExp(P+src+'(?=\\s)','i');
    const m=s.match(re);
    if(!m)return;
    const d=fn(m);
    if(d){r.due=d;s=s.replace(re,' ');}
  };
  tryDate('(\\d{4}-\\d{2}-\\d{2})',m=>{const d=parseISO(m[1]);return iso(d)===m[1]?m[1]:'';});
  tryDate('(?:today|tod)',()=>t);
  tryDate('(?:tomorrow|tmrw|tmr)',()=>addDays(t,1));
  tryDate('in\\s+(\\d+)\\s*(d|days?|w|wks?|weeks?)',m=>addDays(t,+m[1]*(/^w/i.test(m[2])?7:1)));
  tryDate('next\\s+week',()=>addDays(t,(8-dow)%7||7));
  tryDate('eow',()=>addDays(t,(5-dow+7)%7));
  tryDate('(?:next\\s+)?(mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:r(?:s(?:day)?)?)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)',m=>{
    const idx=WD.findIndex(w=>w.toLowerCase()===m[1].slice(0,3).toLowerCase());
    let delta=(idx-dow+7)%7;if(delta===0)delta=7;return addDays(t,delta);
  });
  const mons=MON.map(x=>x.toLowerCase()).join('|');
  const md=(mo,dd)=>{
    const mi=MON.findIndex(x=>x.toLowerCase()===mo.slice(0,3).toLowerCase());
    const day=+dd;if(mi<0||day<1||day>31)return '';
    const y=new Date().getFullYear();
    let d=new Date(y,mi,day);if(d.getMonth()!==mi)return '';
    if(iso(d)<t)d=new Date(y+1,mi,day);
    return iso(d);
  };
  tryDate('('+mons+')[a-z]*\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?',m=>md(m[1],m[2]));
  tryDate('(\\d{1,2})(?:st|nd|rd|th)?\\s+('+mons+')[a-z]*',m=>md(m[2],m[1]));
  r.title=s.replace(/\s+/g,' ').trim();
  return r;
}

/* ---------- checks: what needs a nudge ---------- */
function checkinItems(){
  const t=today(),out=[];
  S.cards.forEach(c=>{
    if(c.status==='done')return;
    const d=c.due?diffDays(t,c.due):null;
    if(d!==null&&d<0)out.push({c:c,kind:'overdue',msg:'Overdue by '+(-d)+' day'+(-d>1?'s':'')});
    else if(isStale(c))out.push({c:c,kind:'stale',msg:'No activity for '+daysSince(c.touched)+' days in '+SNAME[c.status]});
    else if(c.status==='backlog'&&d!==null&&d<=7)out.push({c:c,kind:'pull',msg:'Due '+dueLabel(c.due)+', still in the backlog'});
    else if(c.status==='todo'&&c.rolled>=2&&!c.blocked)out.push({c:c,kind:'rolled',msg:'Rolled over '+c.rolled+' cycles in a row'});
  });
  out.sort((a,b)=>score(b.c)-score(a.c));
  return out;
}
const KIND_LABEL={overdue:['Overdue','bad'],stale:['Gone quiet','warn'],pull:['Due soon','warn'],rolled:['Keeps rolling','']};
const KIND_ACTIONS={
  overdue:[['done','Done',1],['push3','Push 3 days'],['push7','Push 1 week'],['drop','Drop']],
  stale:[['still','Still on it',1],['done','Done'],['blocked','Blocked'],['todo','Back to To do']],
  pull:[['pull','Pull into this cycle',1],['push7','Push 1 week']],
  rolled:[['start','Start now',1],['backlog','To backlog'],['drop','Drop']]
};
function ciApply(action,c){
  const t=today(),base=c.due&&c.due>t?c.due:t;
  switch(action){
    case 'still':c.touched=NOW();break;
    case 'done':setStatus(c,'done');break;
    case 'blocked':c.blocked=true;c.touched=NOW();break;
    case 'todo':setStatus(c,'todo');break;
    case 'push3':c.due=addDays(base,3);c.touched=NOW();break;
    case 'push7':c.due=addDays(base,7);c.touched=NOW();break;
    case 'drop':S.cards=S.cards.filter(x=>x!==c);break;
    case 'pull':setStatus(c,'todo');break;
    case 'start':setStatus(c,'doing');break;
    case 'backlog':setStatus(c,'backlog');break;
  }
}

function parseGit(text){
  const key=S.key.replace(/[^A-Z0-9]/gi,'');
  const re=new RegExp('\\b'+key+'[-_ ]?(\\d+)\\b','gi');
  const closeRe=/\b(clos(e[sd]?)|fix(e[sd])?|resolv(e[sd]?)|finish(e[sd])?|complet(e[sd]?)|done)\b\W{0,3}$/i;
  const rank={doing:1,review:2,done:3};
  const found=new Map();
  text.split(/\r?\n/).forEach(line=>{
    if(!line.trim())return;
    const merged=/\bmerge(d)?\s+pull\s+request\b/i.test(line)||/\bmerged\b/i.test(line);
    const review=/\b(ready for review|for review|review|open(ed)? (a )?pr)\b/i.test(line);
    let m;re.lastIndex=0;
    while((m=re.exec(line))){
      const before=line.slice(0,m.index);
      const to=closeRe.test(before)||merged?'done':review?'review':'doing';
      const num=+m[1],cur=found.get(num);
      if(!cur||rank[to]>rank[cur.to])found.set(num,{to:to,line:line.trim()});
    }
  });
  const moves=[],missing=[],same=[];
  found.forEach((v,num)=>{
    const c=S.cards.find(x=>x.num===num);
    if(!c){missing.push(S.key+'-'+num);return;}
    if(ORDER.indexOf(v.to)>ORDER.indexOf(c.status))moves.push({c:c,to:v.to,line:v.line});
    else same.push(keyOf(c));
  });
  moves.sort((a,b)=>a.c.num-b.c.num);
  return {moves:moves,missing:missing,same:same,total:found.size};
}

/* ---------- standup ---------- */
function prevWorkdayStart(){
  const d=parseISO(today());
  do{d.setDate(d.getDate()-1);}while(d.getDay()===0||d.getDay()===6);
  return d.getTime();
}
function standupText(){
  const since=prevWorkdayStart(),sd=new Date(since);
  const label=diffDays(iso(sd),today())===1?'Since yesterday':'Since '+WDL[sd.getDay()];
  const doneKeys=new Set(),done=[],rev=[];
  S.log.filter(l=>l.t>=since).forEach(l=>{
    if(l.to==='done'&&!doneKeys.has(l.key)){doneKeys.add(l.key);done.push(l);}
  });
  S.log.filter(l=>l.t>=since&&l.to==='review').forEach(l=>{
    if(!doneKeys.has(l.key)&&!rev.some(x=>x.key===l.key))rev.push(l);
  });
  const open=S.cards.filter(c=>!c.blocked);
  let now=open.filter(c=>c.status==='doing'||c.status==='review').sort((a,b)=>score(b)-score(a));
  if(!now.length)now=open.filter(c=>c.status==='todo').sort((a,b)=>score(b)-score(a)).slice(0,3);
  const blocked=S.cards.filter(c=>c.blocked&&c.status!=='done');
  const d=new Date();
  const L=['Standup, '+WD[d.getDay()]+' '+MON[d.getMonth()]+' '+d.getDate(),'',label];
  done.forEach(l=>L.push('- Done: '+l.key+' '+l.title));
  rev.forEach(l=>L.push('- Sent to review: '+l.key+' '+l.title));
  if(!done.length&&!rev.length)L.push('- Nothing moved');
  L.push('','Today');
  now.forEach(c=>L.push('- '+keyOf(c)+' '+c.title+' ('+SNAME[c.status]+(c.due?', due '+dueLabel(c.due):'')+')'));
  if(!now.length)L.push('- Nothing planned yet');
  L.push('','Blocked');
  blocked.forEach(c=>L.push('- '+keyOf(c)+' '+c.title));
  if(!blocked.length)L.push('- None');
  return L.join('\n');
}

/* ---------- clipboard + toast ---------- */
function copyText(text){
  const fallback=()=>{
    const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();let ok=false;
    try{ok=document.execCommand('copy');}catch(e){}
    ta.remove();return ok;
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true,()=>fallback());
  }
  return Promise.resolve(fallback());
}
function toast(msg,snap){
  const el=$('#toast');
  el.innerHTML='<span>'+esc(msg)+'</span>'+(snap?'<button class="btn small" data-act="undo">Undo</button>':'');
  undoSnap=snap||null;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),6500);
}
function undo(){
  if(!undoSnap)return;
  const o=JSON.parse(undoSnap);
  if(o.team){
    Object.keys(o.cards).forEach(id=>{
      const prev=o.cards[id];
      S.cards=S.cards.filter(c=>c.id!==id);
      if(prev)S.cards.push(JSON.parse(prev));
    });
  }else S=normalize(o);
  undoSnap=null;
  save();renderAll();
  $('#toast').classList.remove('show');
  if(dlg.open&&dlg.dataset.kind==='checkin')dlg.innerHTML=checkinHTML();
}

function renderPulse(){
  $('#boardName').textContent=S.name;
  setTitle();
  const len=S.settings.cycleDays,t=today(),el=diffDays(S.cycle.start,t);
  const nw=new Date(),frac=(nw.getHours()*60+nw.getMinutes())/1440;
  const elapsed=clamp(el+frac,0,len);
  const inC=S.cards.filter(c=>c.status!=='backlog');
  const total=inC.length,cnt=s=>inC.filter(c=>c.status===s).length;
  const done=cnt('done'),rev=cnt('review'),doing=cnt('doing');
  const donePct=total?done/total*100:0;
  const flyPct=total?(.7*rev+.3*doing)/total*100:0;
  const timeP=elapsed/len;
  let tone='',label='';
  if(!total)label='No cards yet';
  else if(done===total){tone='good';label='All done';}
  else if(elapsed<1.5)label='Just started';
  else{
    const r=((donePct+flyPct)/100)/Math.max(timeP,.05);
    if(r>=.9){tone='good';label='On track';}else if(r>=.65){tone='warn';label='At risk';}else{tone='bad';label='Behind';}
  }
  const daysLeft=Math.max(0,len-Math.ceil(elapsed));
  const last=S.history[S.history.length-1];
  const tip='Bar shows finished work. The lighter part counts Review at 70% and Doing at 30%. The vertical mark is how much of the cycle has passed.';
  $('#pulse').innerHTML=
    '<div class="pl-top"><span class="cy">Cycle '+S.cycle.n+'</span><span class="muted mono" style="font-size:12px">'+fmtDate(S.cycle.start)+' to '+fmtDate(addDays(S.cycle.start,len-1))+'</span>'+
    (last?'<span class="muted" style="font-size:12px">Last cycle: '+last.done+' of '+last.total+' done</span>':'')+'</div>'+
    '<div class="bar" title="'+esc(tip)+'" role="img" aria-label="'+done+' of '+total+' cards done, '+Math.round(timeP*100)+' percent of the cycle has passed">'+
      '<i class="b-done" style="width:'+donePct+'%"></i><i class="b-fly" style="left:'+donePct+'%;width:'+flyPct+'%"></i><i class="tick" style="left:'+(timeP*100)+'%"></i></div>'+
    '<div class="pl-bot"><span><b>'+done+'</b> of '+total+' done</span><span class="pill '+tone+'">'+label+'</span><span class="muted">'+daysLeft+' day'+(daysLeft===1?'':'s')+' left</span></div>';
}

function visible(c){

function boardCard(c){

  const nextName=s==='done'?'Reopen':{backlog:'Pull into To do',todo:'Start',doing:'Send to Review',review:'Mark done'}[s];
  const chips=[];
  if(c.blocked)chips.push('<span class="chip bad">Blocked</span>');

    chips.push('<span class="chip '+(d<0?'bad':d<=1?'warn':'')+'" title="Due '+fmtDate(c.due)+'">'+ic('cal')+esc(dueLabel(c.due))+'</span>');
  }
  if(isStale(c))chips.push('<button class="chip warn" data-act="still" title="Click to confirm you are still on this">Quiet '+daysSince(c.touched)+'d, still on it?</button>');
  else if((s==='doing'||s==='review')&&daysSince(c.statusSince)>=1)chips.push('<span class="chip" title="Time in '+SNAME[s]+'">'+daysSince(c.statusSince)+'d in '+SNAME[s].toLowerCase()+'</span>');

const GIT_EXAMPLE='a1b2c3d CHK-12 remove legacy coupon endpoint\n9f8e7d6 Fixes CHK-9\n5c4b3a2 feat: apple pay merchant checks (CHK-4)\nMerge pull request #41 from acme/chk-4-apple-pay';

    '<textarea id="git-in" class="mono-area" rows="6" placeholder="'+esc(GIT_EXAMPLE)+'"></textarea>'+

function gitResultHTML(res){
  if(!res.total)return '<p class="hint" style="margin:0">No card keys like '+esc(S.key)+'-12 found in that text.</p>';
  let h='';
  if(res.moves.length){
    h+='<div class="lbl" style="margin-bottom:4px">Proposed moves</div>'+res.moves.map(m=>
      '<label class="gitrow"><input type="checkbox" data-gitpick="'+m.c.num+'" checked><div class="grow"><div><span class="key">'+esc(keyOf(m.c))+'</span> <b>'+esc(m.c.title)+'</b></div><div class="hint">'+SNAME[m.c.status]+' &rarr; <b>'+SNAME[m.to]+'</b></div><div class="code">'+esc(m.line)+'</div></div></label>').join('')+
      '<div class="row" style="margin-top:8px"><button class="btn primary" data-act="git-apply">Apply '+res.moves.length+' move'+(res.moves.length>1?'s':'')+'</button></div>';
  }else h+='<p style="margin:0">Nothing to move. Those cards are already as far along as the commits say.</p>';
  if(res.missing.length)h+='<p class="hint" style="margin:8px 0 0">Not on this board: '+res.missing.map(esc).join(', ')+'</p>';
  return h;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const tabBtn=t.closest('.tab');if(tabBtn){setView(tabBtn.dataset.view);return;}
  const who=t.closest('[data-who]');if(who){ui.who=ui.who===who.dataset.who?'':who.dataset.who;renderAll();return;}
  const tag=t.closest('[data-tag]');if(tag){ui.tag=ui.tag===tag.dataset.tag?'':tag.dataset.tag;renderAll();return;}
  const act=t.closest('[data-act]');
  const cardEl=t.closest('.card'),rowEl=t.closest('.frow,.drow');
  const inDlg=dlg.contains(t);
  if(act){
    const a=act.dataset.act,elc=cardEl||rowEl,c=elc?cardById(elc.dataset.id):null;
    switch(a){
      case 'add':addFromInput();return;
      case 'advance':if(c)advance(c,e.shiftKey?-1:1);return;
      case 'advance-f':if(c)advance(c,1);return;
      case 'still':if(c)mutate(()=>{c.touched=NOW();},keyOf(c)+' still on: nice');return;
      case 'unblock':if(c)mutate(()=>{c.blocked=false;c.touched=NOW();},keyOf(c)+' unblocked');return;
      case 'add-to':ui.addStatus=act.dataset.status;renderPreview();$('#add').focus();window.scrollTo({top:0,behavior:'smooth'});return;
      case 'reset-target':ui.addStatus='todo';renderPreview();$('#add').focus();return;
      case 'open-checkin':openCheckin();return;
      case 'open-git':openDialog('git',gitHTML());return;
      case 'open-standup':openDialog('standup',standupHTML());return;
      case 'open-settings':{openDialog('settings',settingsHTML());const x=$('#s-export');if(x)x.value=T.on?exportText():JSON.stringify(S);return;}
      case 'open-help':openDialog('help',helpHTML());return;
      case 'open-team':openTeam();return;
      case 'open-notes':openNotes();return;
      case 'undo':undo();return;
      case 'clear-all':
        mutate(()=>{S.cards=[];S.log=[];S.history=[];S.nextNum=1;S.sample=false;S.name=S.name==='Checkout revamp'?'My board':S.name;S.key=S.key==='CHK'?'TSK':S.key;},'Board cleared');
        if(dlg.open)dlg.close();return;
    }
    if(inDlg){dialogClick(a,act,e);return;}
  }
  if(inDlg){dialogClick(null,t,e);return;}
  if(cardEl){openCard(cardEl.dataset.id);return;}
  if(rowEl){openCard(rowEl.dataset.id);return;}
});

function dialogClick(a,act,e){
  const kind=dlg.dataset.kind;
  if(a==='close'){dlg.close();return;}
  if(T.on&&teamDialogClick(kind,a,act,e))return;
  if(kind==='card'){
    const c=cardById(dlg.dataset.id);if(!c)return;
    if(a==='copy-branch'){copyText(branchName(c)).then(ok=>{const l=act.querySelector('.mono');if(l){const o=l.textContent;l.textContent=ok?'Copied':'Select and copy';setTimeout(()=>{l.textContent=o;},1400);}});return;}
    if(a==='delete'){mutate(()=>{S.cards=S.cards.filter(x=>x!==c);},keyOf(c)+' deleted');dlg.close();return;}
    const dueBtn=e.target.closest('[data-due]');
    if(dueBtn){
      const v=dueBtn.dataset.due;c.due=v===''?'':addDays(today(),+v);c.touched=NOW();
      $('#f-due').value=c.due;$('#prioHint').textContent=prioHint(c);commit();return;
    }
    const rm=e.target.closest('[data-rmcheck]');
    if(rm){c.checks.splice(+rm.dataset.rmcheck,1);c.touched=NOW();$('#checks').innerHTML=checksHTML(c);commit();return;}
    return;
  }
  if(kind==='checkin'&&a==='ci'){
    const c=cardById(act.dataset.id);if(!c)return;
    const scroll=dlg.scrollTop;
    mutate(()=>ciApply(act.dataset.do,c),null,true);
    dlg.innerHTML=checkinHTML();dlg.scrollTop=scroll;return;
  }
  if(kind==='git'){
    if(a==='git-example'){$('#git-in').value=GIT_EXAMPLE;return;}
    if(a==='git-read'){$('#git-out').innerHTML=gitResultHTML(parseGit($('#git-in').value));return;}
    if(a==='git-apply'){
      const picks=$$('[data-gitpick]',dlg).filter(x=>x.checked).map(x=>+x.dataset.gitpick);
      const res=parseGit($('#git-in').value).moves.filter(m=>picks.indexOf(m.c.num)>=0);
      if(!res.length)return;
      mutate(()=>res.forEach(m=>setStatus(m.c,m.to)),res.length+' card'+(res.length>1?'s':'')+' moved from git activity');
      dlg.close();return;
    }
  }
  if(kind==='standup'&&a==='copy-standup'){
    copyText($('#standup').value).then(ok=>{act.lastChild.textContent=ok?'Copied':'Select and copy';setTimeout(()=>{act.lastChild.textContent='Copy';},1400);});
    if(!navigator.clipboard)$('#standup').select();return;
  }
  if(kind==='settings'){
    if(a==='roll-now'){
      mutate(()=>{rollCycle(today(),1);},'Cycle '+(S.cycle.n+1)+' started. Unfinished cards rolled over.');
      dlg.close();return;
    }
    if(a==='load-sample'){mutate(()=>{S=sampleState();},'Example board loaded');dlg.close();return;}
    if(a==='copy-export'){copyText($('#s-export').value).then(ok=>{act.lastChild.textContent=ok?'Copied':'Select and copy';setTimeout(()=>{act.lastChild.textContent='Copy backup';},1400);});$('#s-export').select();return;}
    if(a==='import'){
      let o=null;try{o=normalize(JSON.parse($('#s-import').value));}catch(err){}
      if(!o){$('#importMsg').textContent='That does not look like a Nudge backup.';return;}
      mutate(()=>{S=o;},'Backup restored');dlg.close();return;
    }
  }
}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
dlg.addEventListener('close',()=>{dlg.dataset.kind='';renderAll();});

/* dialog form fields */
dlg.addEventListener('input',e=>{
  const kind=dlg.dataset.kind,id=e.target.id;
  if(kind==='card'){
    const c=cardById(dlg.dataset.id);if(!c)return;
    if(id==='f-title'){if(!e.target.value.trim())return;c.title=e.target.value.slice(0,200);}
    else if(id==='f-notes')c.notes=e.target.value;
    else if(id==='f-who'){if(T.on)return;c.assignee=cleanName(e.target.value);}
    else return;
    c.touched=NOW();commit();
  }
});
dlg.addEventListener('change',e=>{
  const kind=dlg.dataset.kind,id=e.target.id,el=e.target;
  if(T.on&&teamDialogChange(e))return;
  if(kind==='card'){
    const c=cardById(dlg.dataset.id);if(!c)return;
    if(T.on&&id==='f-who'){c.assigneeId=el.value||null;c.assignee=teamName(c.assigneeId);c.touched=NOW();commit();return;}
    if(T.on&&id==='f-rev'){c.reviewerId=el.value||null;c.touched=NOW();commit();return;}
    if(id==='f-title'){if(!el.value.trim()){el.value=c.title;return;}c.title=el.value.trim().slice(0,200);}
    else if(id==='f-status'){setStatus(c,el.value);const f=$('#f-blocked');if(f)f.checked=c.blocked;$('#cardAge').textContent='Created '+ago(c.created)+', '+SNAME[c.status]+' since today';}
    else if(id==='f-prio'){c.prio=el.value;c.touched=NOW();}
    else if(id==='f-due'){c.due=el.value;c.touched=NOW();$('#prioHint').textContent=prioHint(c);}
    else if(id==='f-tags'){c.tags=Array.from(new Set(el.value.toLowerCase().split(/[\s,#]+/).filter(Boolean).map(t=>t.slice(0,30)))).slice(0,20);el.value=c.tags.join(' ');c.touched=NOW();}
    else if(id==='f-blocked'){c.blocked=el.checked;c.touched=NOW();}
    else if(el.dataset.check!==undefined){
      const k=c.checks[+el.dataset.check];k.done=el.checked;c.touched=NOW();
      if(k.done&&(c.status==='todo'||c.status==='backlog')){setStatus(c,'doing');$('#f-status').value='doing';}
      $('#checks').innerHTML=checksHTML(c);
    }
    else return;
    commit();
  }else if(kind==='settings'){
    const s=S.settings;
    if(id==='s-name')S.name=el.value.trim()||'My board';
    else if(id==='s-key'){const v=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'');S.key=v||'TSK';el.value=S.key;}
    else if(id==='s-len')s.cycleDays=+el.value;
    else if(id==='s-wip')s.wip=+el.value;
    else if(id==='s-stale')s.staleDays=+el.value;
    else return;
    commit();{const x=$('#s-export');if(x)x.value=T.on?exportText():JSON.stringify(S);}
  }
});
dlg.addEventListener('keydown',e=>{
  if(dlg.dataset.kind==='team'&&e.key==='Enter'&&(e.target.id==='t-name'||e.target.id==='t-email')){
    e.preventDefault();const b=$('#dlg [data-act="team-add"]');if(b)b.click();return;
  }
  if(dlg.dataset.kind==='card'&&e.target.id==='f-check'&&e.key==='Enter'){
    e.preventDefault();
    const c=cardById(dlg.dataset.id),v=e.target.value.trim();
    if(!c||!v)return;
    if(c.checks.length>=50){toast('A card can have up to 50 steps.');return;}
    c.checks.push({t:v.slice(0,200),done:false});c.touched=NOW();e.target.value='';
    $('#checks').innerHTML=checksHTML(c);commit();
  }
});

/* board: drag and drop, keyboard */
const boardEl=$('#board');
boardEl.addEventListener('dragstart',e=>{
  const c=e.target.closest&&e.target.closest('.card');if(!c)return;
  e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';
  requestAnimationFrame(()=>c.classList.add('dragging'));
});
boardEl.addEventListener('dragend',()=>{$$('.dragging',boardEl).forEach(x=>x.classList.remove('dragging'));$$('.drop',boardEl).forEach(x=>x.classList.remove('drop'));});
boardEl.addEventListener('dragover',e=>{const col=e.target.closest('.col');if(!col)return;e.preventDefault();$$('.drop',boardEl).forEach(x=>{if(x!==col)x.classList.remove('drop');});col.classList.add('drop');});
boardEl.addEventListener('dragleave',e=>{const col=e.target.closest('.col');if(col&&!col.contains(e.relatedTarget))col.classList.remove('drop');});
boardEl.addEventListener('drop',e=>{
  const col=e.target.closest('.col');if(!col)return;
  e.preventDefault();col.classList.remove('drop');
  const c=cardById(e.dataTransfer.getData('text/plain'));
  if(c&&c.status!==col.dataset.status)mutate(()=>setStatus(c,col.dataset.status),keyOf(c)+' moved to '+SNAME[col.dataset.status]);
});
boardEl.addEventListener('keydown',e=>{
  const el=e.target;
  if(!el.classList||!el.classList.contains('card'))return;
  const c=cardById(el.dataset.id);if(!c)return;
  if(e.key==='ArrowRight'){e.preventDefault();advance(c,1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();advance(c,-1);}
  else if(e.key==='ArrowDown'&&el.nextElementSibling&&el.nextElementSibling.classList.contains('card')){e.preventDefault();el.nextElementSibling.focus();}
  else if(e.key==='ArrowUp'&&el.previousElementSibling&&el.previousElementSibling.classList.contains('card')){e.preventDefault();el.previousElementSibling.focus();}
  else if(e.key==='Enter'||e.key==='e'){e.preventDefault();openCard(c.id);}
  else if(e.key==='d'&&c.status!=='done'){e.preventDefault();mutate(()=>setStatus(c,'done'),keyOf(c)+' marked done');}
});

/* quick add + filter inputs */
$('#add').addEventListener('input',renderPreview);
$('#add').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();addFromInput();}
  else if(e.key==='Escape'){e.target.value='';ui.addStatus='todo';renderPreview();e.target.blur();}
});
$('#q').addEventListener('input',e=>{ui.q=e.target.value.trim();if(ui.view==='board')renderBoard();else renderFocus();});

/* global shortcuts */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey){
    if((e.key==='z'||e.key==='Z')&&!e.shiftKey&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&undoSnap){e.preventDefault();undo();}
    return;
  }
  if(dlg.open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;
  const k=e.key;
  if(k==='n'){e.preventDefault();$('#add').focus();}
  else if(k==='/'){e.preventDefault();$('#q').focus();}
  else if(k==='c')openCheckin();
  else if(k==='g')openDialog('git',gitHTML());
  else if(k==='s')openDialog('standup',standupHTML());
  else if(k==='v')setView(ui.view==='board'?'focus':'board');
  else if(k==='z'&&undoSnap)undo();
  else if(k==='?')openDialog('help',helpHTML());
});

const CFG=window.NUDGE_CONFIG||{};
const TEAM_CONFIGURED=!!(window.NUDGE_BACKEND||(CFG.supabaseUrl&&CFG.supabaseKey));
let B=null;
const SYNC={last:new Map(),busy:false,again:false,timer:null,boardSig:''};

function isPM(){return !!(T.me&&T.me.role==='pm');}
function teamName(id){const p=T.team.find(x=>x.id===id);return p?p.name:'';}
function newId(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,ch=>{const r=Math.random()*16|0;return (ch==='x'?r:(r&3|8)).toString(16);});
}
// "@sam" -> the one active teammate it clearly means, or null
function resolveMention(tok){
  const t=String(tok||'').toLowerCase(),act=T.team.filter(p=>p.active);
  let m=act.filter(p=>p.name.toLowerCase()===t);
  if(m.length!==1)m=act.filter(p=>p.name.toLowerCase().split(' ')[0]===t);
  if(m.length!==1)m=act.filter(p=>p.name.toLowerCase().startsWith(t));
  return m.length===1?m[0]:null;
