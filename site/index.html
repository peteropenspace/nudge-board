/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const tabBtn=t.closest('.tab');if(tabBtn){setView(tabBtn.dataset.view);return;}
  const who=t.closest('[data-who]');if(who){
    ui.who=ui.who===who.dataset.who?'':who.dataset.who;renderAll();
    // On a touch screen there is no hover: show who it is for a moment after the tap
    if(matchMedia('(hover:none)').matches){const el=$('#filters [data-who="'+CSS.escape(who.dataset.who)+'"]');if(el)showTip(el,2200);}
    return;
  }
  const tag=t.closest('[data-tag]');if(tag){ui.tag=ui.tag===tag.dataset.tag?'':tag.dataset.tag;renderAll();return;}
  const act=t.closest('[data-act]');
  const cardEl=t.closest('.card'),rowEl=t.closest('.frow,.drow');
  const inDlg=dlg.contains(t);
  if(act){
    const a=act.dataset.act,elc=cardEl||rowEl,c=elc?cardById(elc.dataset.id):null;
    switch(a){
      case 'add':addFromInput();return;
      case 'advance':if(c)advance(c,e.shiftKey?-1:1);return;
      case 'advance-f':if(c)advance(c,1);return;
      case 'still':if(c)mutate(()=>{c.touched=NOW();},keyOf(c)+' still on: nice');return;
      case 'unblock':if(c)mutate(()=>{c.blocked=false;c.touched=NOW();},keyOf(c)+' unblocked');return;
      case 'add-to':ui.addStatus=act.dataset.status;renderPreview();$('#add').focus();window.scrollTo({top:0,behavior:'smooth'});return;
      case 'reset-target':ui.addStatus='todo';renderPreview();$('#add').focus();return;
      case 'open-checkin':openCheckin();return;
      case 'open-git':openDialog('git',gitHTML());return;
      case 'open-standup':openDialog('standup',standupHTML());return;
      case 'open-settings':{openDialog('settings',settingsHTML());const x=$('#s-export');if(x)x.value=T.on?exportText():JSON.stringify(S);return;}
      case 'open-help':openDialog('help',helpHTML());return;
      case 'open-team':openTeam();return;
      case 'open-cycle':openCycle();return;
      case 'col-reviewer':if(T.on&&isPM()&&COLREV[act.dataset.status]){openDialog('colrev',colReviewerDialogHTML(act.dataset.status));$('#cr-who').focus();}return;
      case 'open-notes':openNotes();return;
      case 'undo':undo();return;
      case 'toggle-backlog':
        ui.hideBacklog=!ui.hideBacklog;writePref('nudge.hideBacklog',ui.hideBacklog?'1':'0');hideTip();renderBoard();
        {const b=$('#board [data-act="toggle-backlog"]');if(b)b.focus({preventScroll:true});}
        return;
      case 'toast-open':{
        $('#toast').classList.remove('show');
        const id=act.dataset.id;if(!cardById(id))return;
        if(!(dlg.open&&dlg.dataset.kind==='card'&&dlg.dataset.id===id))openCard(id);
        const f=act.dataset.focus&&$('#'+act.dataset.focus);if(f)f.focus();
        return;
      }
      case 'clear-all':
        mutate(()=>{S.cards=[];S.log=[];S.history=[];S.nextNum=1;S.sample=false;S.name=S.name==='Checkout revamp'?'My board':S.name;S.key=S.key==='CHK'?'TSK':S.key;},'Board cleared');
        if(dlg.open)dlg.close();return;
    }
    if(inDlg){dialogClick(a,act,e);return;}
  }
  if(inDlg){dialogClick(null,t,e);return;}
  if(cardEl){openCard(cardEl.dataset.id);return;}
  if(rowEl){openCard(rowEl.dataset.id);return;}
});

function dialogClick(a,act,e){
  const kind=dlg.dataset.kind;
  if(a==='close'){dlg.close();return;}
  if(a==='copy-val'){copyText(act.dataset.val).then(ok=>{const t=act.lastChild;const o=t.textContent;t.textContent=ok?'Copied':'Select and copy';setTimeout(()=>{t.textContent=o;},1400);});return;}
  if(a==='open-import'){openDialog('import',importHTML());return;}
  if(a==='gh-retry'){loadGithub();return;}
  if(a==='email-retry'){openTeam();return;}
  if(a==='shipped-retry'){showShipped();return;}
  if(a==='cmt-retry'){const id=dlg.dataset.id;T.comments=null;refreshComments(id);loadComments(id);return;}
  if(kind==='cycle'&&a==='report-open'){toggleReport(act);return;}
  if(kind==='cycle'&&a==='report-preview'){withBusy(act,previewReport);return;}
  if(kind==='cycle'&&a==='report-send'){withBusy(act,sendReport);return;}
  if(kind==='cycle'&&a==='copy-shipped'){
    if(T.shipped)copyText(shippedText(T.shipped.cy,T.shipped.list)).then(ok=>toast(ok?'Copied. Paste it into your update.':'Could not copy. Select the list and copy it.'));
    return;
  }
  if(kind==='import'&&a==='imp-read'){
    const out=$('#imp-out');
    try{T.importParsed=parseImport($('#imp-text').value);out.innerHTML=importPreviewHTML(T.importParsed);}
    catch(err){out.innerHTML='<p class="badline" style="margin:0">'+esc(err.message)+'</p>';}
    return;
  }
  if(kind==='import'&&a==='imp-go'){
    const m=$('#imp-msg');if(m){m.textContent='Importing…';m.className='hint';}
    withBusy(act,()=>runImport().catch(err=>{if(m){m.textContent=(err.message||'That did not import.')+' Nothing was added.';m.className='hint badline';}}));
    return;
  }
  if(T.on&&teamDialogClick(kind,a,act,e))return;
  if(kind==='card'){
    const c=cardById(dlg.dataset.id);if(!c)return;
    const mdb=e.target.closest('[data-md]');
    if(mdb){
      const t=mdb.dataset.md;
      if(t==='story'){
        if(T.on&&!isPM()){toast('Only a project manager can use the user story template.');return;}
        const ta=$('#f-notes'),ed=ta.closest('.md-ed');edShow(ed,false);
        if(ta.value.indexOf('Acceptance criteria')<0){ta.value=ta.value.trim()?ta.value.replace(/\s*$/,'\n\n')+STORY_TEMPLATE:STORY_TEMPLATE;edChanged(ta);}
        const at=ta.value.indexOf('[who]');if(at>=0)ta.setSelectionRange(at,at+5);ta.focus();return;
      }
      const p=edParts(mdb);if(!p)return;
      if(t==='write'||t==='preview'){edShow(p.ed,t==='preview');return;}
      if(t==='image'){$('[data-md-file]',p.ed).click();return;}
      edTool(p.ta,t);return;
    }
    if(a==='cmt-post'){withBusy(act,()=>postComment(c));return;}
    if(a==='claim'){mutate(()=>{c.assigneeId=myId();c.assignee=T.me.name;c.touched=NOW();},keyOf(c)+' is yours now');openCard(c.id);return;}
    if(a==='review-ok'||a==='review-back'){
      const to=a==='review-back'?'doing':c.status==='review'?'security':'done';
      mutate(()=>setStatus(c,to),keyOf(c)+{doing:' sent back to Doing',security:' passed QA and moved to Security',done:' signed off and moved to Done'}[to]);
      openCard(c.id);return;
    }
    if(a==='cmt-del'){
      const cid=act.dataset.cid;
      if(act.dataset.armed!=='1'){act.dataset.armed='1';act.textContent='Really delete?';return;}
      withBusy(act,async()=>{
        try{
          if(T.on){await B.deleteComment(cid);if(T.comments&&T.comments.card===c.id)T.comments.rows=T.comments.rows.filter(r=>r.id!==cid);}
          else{c.comments=(c.comments||[]).filter(r=>r.id!==cid);save();}
          refreshComments(c.id);
        }catch(err){toast(err.message||'Could not delete that comment.');}
      });
      return;
    }
    if(a==='copy-branch'){copyText(branchName(c)).then(ok=>{const l=act.querySelector('.mono');if(l){const o=l.textContent;l.textContent=ok?'Copied':'Select and copy';setTimeout(()=>{l.textContent=o;},1400);}});return;}
    if(a==='delete'){mutate(()=>{S.cards=S.cards.filter(x=>x!==c);},keyOf(c)+' deleted');dlg.close();return;}
    const dueBtn=e.target.closest('[data-due]');
    if(dueBtn){
      const v=dueBtn.dataset.due;c.due=v===''?'':addDays(today(),+v);c.touched=NOW();
      $('#f-due').value=c.due;$('#prioHint').textContent=prioHint(c);commit();return;
    }
    const rm=e.target.closest('[data-rmcheck]');
    if(rm){c.checks.splice(+rm.dataset.rmcheck,1);c.touched=NOW();$('#checks').innerHTML=checksHTML(c);commit();return;}
    return;
  }
  if(kind==='checkin'&&a==='ci'){
    const c=cardById(act.dataset.id);if(!c)return;
    const scroll=dlg.scrollTop;
    mutate(()=>ciApply(act.dataset.do,c),null,true);
    dlg.innerHTML=checkinHTML();dlg.scrollTop=scroll;return;
  }
  if(kind==='git'){
    if(a==='git-example'){$('#git-in').value=GIT_EXAMPLE;return;}
    if(a==='git-read'){$('#git-out').innerHTML=gitResultHTML(parseGit($('#git-in').value));return;}
    if(a==='git-apply'){
      const picks=$$('[data-gitpick]',dlg).filter(x=>x.checked).map(x=>+x.dataset.gitpick);
      const res=parseGit($('#git-in').value).moves.filter(m=>picks.indexOf(m.c.num)>=0);
      if(!res.length)return;
      mutate(()=>res.forEach(m=>setStatus(m.c,m.to)),res.length+' card'+(res.length>1?'s':'')+' moved from git activity');
      dlg.close();return;
    }

      dlg.close();return;

function isPM(){return !!(T.me&&T.me.role==='pm');}

function newId(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,ch=>{const r=Math.random()*16|0;return (ch==='x'?r:(r&3|8)).toString(16);});
}
// "@sam" -> the one active teammate it clearly means, or null
function resolveMention(tok){
  const exact=personByHandle(tok);if(exact)return exact;
  const t=String(tok||'').toLowerCase(),act=T.team.filter(p=>p.active);
  let m=act.filter(p=>p.name.toLowerCase()===t);
  if(m.length!==1)m=act.filter(p=>p.name.toLowerCase().split(' ')[0]===t);
  if(m.length!==1)m=act.filter(p=>p.name.toLowerCase().startsWith(t));
  return m.length===1?m[0]:null;
}
function timeAgo(ts){
  const m=Math.max(0,Math.round((NOW()-ts)/60000));
  if(m<1)return 'just now';if(m<60)return m+'m ago';
  const h=Math.round(m/60);if(h<24)return h+'h ago';
  return Math.round(h/24)+'d ago';
}

/* ----- the Supabase adapter. Everything the app needs from the server is here. ----- */
const SUPABASE_JS={
  src:'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js',
  integrity:'sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok'
};
function loadScript(src,integrity){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=src;
    if(integrity){s.integrity=integrity;s.crossOrigin='anonymous';}
    s.onload=res;s.onerror=()=>rej(new Error('Could not load the sign-in library. Check your connection and reload.'));
    document.head.appendChild(s);
  });
}
function makeSupabaseBackend(cfg){
  let sb=null;
  const ok=r=>{if(r.error)throw r.error;return r.data;};
  const PEOPLE_COLS='id,name,email,role,timezone,notify_mode,pm_instant,active,muted_until,user_id,join_code,away_until,security';
  return {
    async init(){
      await loadScript(SUPABASE_JS.src,SUPABASE_JS.integrity);
      sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true},
        realtime:{worker:true}});   // keeps live updates (and desktop notifications) going in a background tab
    },
    async session(){const {data}=await sb.auth.getSession();return data.session?{email:data.session.user.email}:null;},
    onAuth(cb){sb.auth.onAuthStateChange((ev,s)=>cb(ev,s?{email:s.user.email}:null));},
    async signInGoogle(){ok(await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}}));},
    // Sign-in codes by email are paused: they need an email service on the Supabase side.
    // async sendCode(email){ok(await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}}));},
    // async verifyCode(email,token){ok(await sb.auth.verifyOtp({email,token,type:'email'}));},
    async signIn(email,password){ok(await sb.auth.signInWithPassword({email,password}));},
    async startJoin(email,code){return ok(await sb.rpc('start_join',{p_email:email,p_code:code}));},
    async signUp(email,password){const d=ok(await sb.auth.signUp({email,password}));return !!d.session;},
    async finishJoin(code){return ok(await sb.rpc('finish_join',{p_code:code}));},
    async changePassword(password){ok(await sb.auth.updateUser({password}));},
    async resetJoinCode(id){return ok(await sb.rpc('reset_join_code',{p_person:id}));},
    async signOut(){await sb.auth.signOut();},
    async whoami(){return ok(await sb.rpc('whoami'));},
    async rollIfDue(){return ok(await sb.rpc('roll_cycle_if_due'));},
    async rollNow(){return ok(await sb.rpc('roll_cycle_now'));},
    async loadAll(pm){
      const since=new Date(Date.now()-14*864e5).toISOString();
      const [board,team,cards,events,notes,history,people]=await Promise.all([
        sb.from('board').select('*').eq('id',1).single(),
        sb.from('team').select('id,name,role,timezone,active,away_until,security').order('name'),
        sb.from('cards').select('*').is('archived_at',null).order('num'),
        sb.from('card_events').select('card_key,title,from_status,to_status,actor_id,at').gte('at',since).order('at'),
        sb.from('notifications').select('id,card_id,kind,message,created_at,read_at').order('created_at',{ascending:false}).limit(40),
        sb.from('cycle_history').select('*').order('n'),
        pm?sb.from('people').select(PEOPLE_COLS).order('name'):Promise.resolve({data:null,error:null})
      ]);
      return {board:ok(board),team:ok(team),cards:ok(cards),events:ok(events),notes:ok(notes),history:ok(history),people:ok(people)};
    },
    async loadPeople(pm){
      const [team,people]=await Promise.all([
        sb.from('team').select('id,name,role,timezone,active,away_until,security').order('name'),
        pm?sb.from('people').select(PEOPLE_COLS).order('name'):Promise.resolve({data:null,error:null})
      ]);
      return {team:ok(team),people:ok(people)};
    },
    async cardsSince(iso){return ok(await sb.from('cards').select('*').gte('updated_at',iso));},
    async notesSince(iso){return ok(await sb.from('notifications').select('id,card_id,kind,message,created_at,read_at').gte('created_at',iso));},
    async insertCard(row){return ok(await sb.from('cards').insert(row).select().single());},
    async updateCard(id,patch,version){const d=ok(await sb.from('cards').update(patch).eq('id',id).eq('version',version).select());return d.length?d[0]:null;},
    async deleteCard(id){return ok(await sb.from('cards').delete().eq('id',id).select('id')).length>0;},
    async updateBoard(patch){ok(await sb.from('board').update(patch).eq('id',1));},
    async insertPerson(p){ok(await sb.from('people').insert(p));},
    async updatePerson(id,patch){const d=ok(await sb.from('people').update(patch).eq('id',id).select('id'));if(!d.length)throw new Error('That change was not allowed.');},
    async deletePerson(id){ok(await sb.from('people').delete().eq('id',id));},
    async getSettings(){return ok(await sb.from('notify_settings').select('*').eq('id',1).single());},
    async updateSettings(patch){ok(await sb.from('notify_settings').update(patch).eq('id',1));},
    async emailStatus(){return ok(await sb.rpc('email_status'));},
    async sendTestEmail(){return ok(await sb.rpc('send_test_email'));},
    // n: the cycle number, or null for the current one
    async cycleReportPreview(n,note){return ok(await sb.rpc('cycle_report_preview',{p_n:n,p_note:note||null}));},
    async updateMyPrefs(mode,tz,pause){return ok(await sb.rpc('update_my_prefs',{p_notify_mode:mode,p_timezone:tz,p_pause:pause}));},
    async setMyAway(until){return ok(await sb.rpc('set_my_away',{p_until:until||null}));},
    async githubStatus(){return ok(await sb.rpc('github_status'));},
    async shipped(from,to){return ok(await sb.from('cards').select('num,title,tags,size,unplanned,done_at').eq('status','done').gte('done_at',from).lt('done_at',to).order('done_at'));},
    async insertCards(rows){for(let i=0;i<rows.length;i+=100)ok(await sb.from('cards').insert(rows.slice(i,i+100)));},
    async markNotesRead(){ok(await sb.from('notifications').update({read_at:new Date().toISOString()}).is('read_at',null));},
    async loadComments(cardId){return ok(await sb.from('card_comments').select('id,card_id,author_id,body,mentions,created_at').eq('card_id',cardId).order('created_at'));},
    async addComment(cardId,body,mentions){return ok(await sb.from('card_comments').insert({card_id:cardId,body,mentions}).select('id,card_id,author_id,body,mentions,created_at').single());},
    async deleteComment(id){const d=ok(await sb.from('card_comments').delete().eq('id',id).select('id'));if(!d.length)throw new Error('Only the person who wrote it, or a project manager, can delete a comment.');},
    async uploadImage(cardId,blob,ext){
      const path=cardId+'/'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+uid())+'.'+ext;
      ok(await sb.storage.from('card-images').upload(path,blob,{contentType:blob.type,cacheControl:'31536000',upsert:false}));
      return path;
    },
    async imageUrls(paths){const d=ok(await sb.storage.from('card-images').createSignedUrls(paths,3600));const m={};d.forEach(x=>{if(x.signedUrl&&!x.error)m[x.path]=x.signedUrl;});return m;},
    async mute(token,mode){return ok(await sb.rpc('mute_by_token',{p_token:token,p_mode:mode}));},
    subscribe(h){
      const ch=sb.channel('nudge-board')
        .on('postgres_changes',{event:'*',schema:'public',table:'cards'},p=>h.card(p))
        .on('postgres_changes',{event:'*',schema:'public',table:'board'},()=>h.board())
        .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},p=>h.note(p.new))
        .on('postgres_changes',{event:'*',schema:'public',table:'card_comments'},p=>h.comment&&h.comment(p))
        .subscribe(st=>h.status(st));
      return ()=>sb.removeChannel(ch);
    }
  };
}

/* ----- card <-> row ----- */
function rowFromCard(c){
  return {title:c.title,notes:c.notes||'',status:c.status,prio:c.prio,assignee_id:c.assigneeId||null,reviewer_id:c.reviewerId||null,
    due:c.due||null,tags:c.tags||[],checks:(c.checks||[]).map(k=>({t:k.t,done:!!k.done})),blocked:!!c.blocked,
    horizon:c.horizon||'later',size:c.size||null,waiting_on:c.blocked&&c.waitingOn||null,block_note:c.blocked?c.blockNote||'':''};
}
function cardFromRow(r){
  const ts=x=>x?Date.parse(x):null;
  return {id:r.id,num:r.num,title:r.title,notes:r.notes||'',status:r.status,prio:r.prio,
    assignee:teamName(r.assignee_id),assigneeId:r.assignee_id||null,reviewerId:r.reviewer_id||null,
    due:r.due||'',tags:Array.isArray(r.tags)?r.tags:[],
    checks:(Array.isArray(r.checks)?r.checks:[]).filter(k=>k&&typeof k==='object').map(k=>({t:String(k.t==null?'':k.t),done:!!k.done})),blocked:!!r.blocked,
    horizon:r.horizon||'later',size:r.size||null,unplanned:!!r.unplanned,waitingOn:r.waiting_on||null,blockNote:r.block_note||'',
    rolled:r.rolled||0,createdBy:r.created_by||null,created:ts(r.created_at),touched:ts(r.touched_at),statusSince:ts(r.status_since),doneAt:ts(r.done_at),version:r.version};
}
const cardSig=c=>JSON.stringify(rowFromCard(c))+'|'+c.touched;
const boardSig=()=>JSON.stringify([S.name,S.settings.cycleDays,S.settings.wip,S.settings.staleDays,S.reviewerId||null,S.secReviewerId||null,S.timezone||'UTC',S.goals||'']);
const boardPatch=()=>({name:S.name,cycle_goals:S.goals||'',cycle_days:S.settings.cycleDays,wip_limit:S.settings.wip,stale_days:S.settings.staleDays,
  default_reviewer_id:S.reviewerId||null,security_reviewer_id:S.secReviewerId||null,timezone:S.timezone||'UTC',updated_at:new Date().toISOString()});

const renderSoon=(function(){let t;return function(){clearTimeout(t);t=setTimeout(renderAll,120);};})();
const teamRefreshSoon=(function(){let t;return function(){clearTimeout(t);t=setTimeout(()=>{refreshPeople().catch(()=>{});},800);};})();

function applyLoaded(d){
  T.team=d.team;T.people=d.people;T.notes=d.notes;
  const b=d.board;
  S={v:1,name:b.name,key:b.card_prefix,nextNum:0,timezone:b.timezone,reviewerId:b.default_reviewer_id||null,secReviewerId:b.security_reviewer_id||null,
    settings:{cycleDays:b.cycle_days,wip:b.wip_limit,staleDays:b.stale_days},goals:b.cycle_goals||'',
    cycle:{n:b.cycle_n,start:b.cycle_start},
    history:d.history.map(h=>({n:h.n,start:h.start_date,end:h.end_date,done:h.done,total:h.total})),
    cards:d.cards.map(cardFromRow),
    log:d.events.filter(e=>e.actor_id===T.me.id).map(e=>({t:Date.parse(e.at),key:e.card_key,title:e.title,from:e.from_status||'',to:e.to_status})),
    sample:false};
  SYNC.last=new Map(S.cards.map(c=>[c.id,{sig:cardSig(c),version:c.version}]));
  SYNC.boardSig=boardSig();
  T.lastSeen=d.cards.reduce((m,r)=>(r.updated_at&&r.updated_at>m?r.updated_at:m),'')||new Date(Date.now()-60000).toISOString();
  T.noteSeen=d.notes.reduce((m,n)=>(n.created_at>m?n.created_at:m),'')||new Date(Date.now()-60000).toISOString();
}
async function reloadAll(opts){
  const discard=!!(opts&&opts.discard);
  if(!discard){clearTimeout(SYNC.timer);await pushChanges();}   // never throw away edits that are not saved yet
  const d=await B.loadAll(isPM());
  if(!discard&&dirty()){syncSoon();return;}                      // edits arrived while loading: keep them
  applyLoaded(d);T.fullAt=NOW();renderAll();
}

/* ----- saving: compare with what the server last told us and send only the differences ----- */
function syncSoon(){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushChanges,250);}
// Anything on screen that the server has not been told about yet?
function dirty(){
  if(S.cards.some(c=>{const k=SYNC.last.get(c.id);return !k||k.sig!==cardSig(c);}))return true;
  const present=new Set(S.cards.map(c=>c.id));
  for(const id of SYNC.last.keys())if(!present.has(id))return true;
  return isPM()&&boardSig()!==SYNC.boardSig;
}
function afterSave(c,r,sent){
  if(cardSig(c)===sent){                 // untouched while saving: take the server's copy
    Object.assign(c,cardFromRow(r));
    SYNC.last.set(c.id,{sig:cardSig(c),version:r.version});
  }else{                                 // edited again while saving: keep those edits and send them next round
    c.num=r.num;c.rolled=r.rolled||0;c.version=r.version;c.created=Date.parse(r.created_at);
    c.statusSince=Date.parse(r.status_since);c.doneAt=r.done_at?Date.parse(r.done_at):null;
    SYNC.last.set(c.id,{sig:sent,version:r.version});
    SYNC.again=true;
  }
  renderSoon();
}
function pushChanges(){
  if(!T.ready||!B)return Promise.resolve();
  if(SYNC.run){SYNC.again=true;return SYNC.run;}
  setSyncState('saving');
  let failed=false;
  SYNC.run=(async()=>{
    try{
      do{
        SYNC.again=false;
        const present=new Set(S.cards.map(c=>c.id));
        for(const id of Array.from(SYNC.last.keys())){
          if(present.has(id))continue;
          const removed=await B.deleteCard(id);
          SYNC.last.delete(id);
          if(!removed){toast('Only the project manager or the person who added a card can delete it.');await reloadAll({discard:true});return;}
        }
        for(const c of S.cards.slice()){
          const known=SYNC.last.get(c.id);
          if(!known){
            const sent=cardSig(c);
            const r=await B.insertCard(Object.assign({id:c.id},rowFromCard(c)));
            afterSave(c,r,sent);
          }else if(known.sig!==cardSig(c)){
            const sent=cardSig(c);
            const r=await B.updateCard(c.id,rowFromCard(c),known.version);
            if(!r){toast('Someone just changed that card, so I refreshed the board.');await reloadAll({discard:true});return;}
            afterSave(c,r,sent);
          }
        }
        if(isPM()&&boardSig()!==SYNC.boardSig){await B.updateBoard(boardPatch());SYNC.boardSig=boardSig();}
      }while(SYNC.again);
    }catch(e){failed=true;syncError(e);}
  })().then(()=>{SYNC.run=null;if(!failed)setSyncState('saved');});
  return SYNC.run;
}
function syncError(e){
  console.error(e);
  const m=(e&&e.message)||'';
  // No connection: keep the edits on screen and send them when the connection is back
  if(!navigator.onLine||/failed to fetch|networkerror|load failed|network request/i.test(m)){setSyncState('offline');renderNotices();return;}
  setSyncState('failed');
  let msg='That change did not save, so I refreshed the board.';
  if(/project manager|assign|reviewer/i.test(m))msg=m;
  else if((e&&e.code==='23514')||/check constraint|violates/i.test(m))msg='That change was not allowed. A title, note, tag or step was empty or too long. I refreshed the board.';
  toast(msg);
  reloadAll({discard:true}).catch(()=>{});
}

/* ----- changes made by other people ----- */
function onRemoteCard(p){
  if(p.eventType==='DELETE'){
    const id=p.old&&p.old.id;
    if(id){S.cards=S.cards.filter(c=>c.id!==id);SYNC.last.delete(id);renderSoon();}
    return;
  }
  const r=p.new;if(!r)return;
  const cur=S.cards.find(c=>c.id===r.id);
  if(r.archived_at){
    if(cur){S.cards=S.cards.filter(c=>c.id!==r.id);SYNC.last.delete(r.id);renderSoon();}
    return;
  }
  const known=SYNC.last.get(r.id);
  if(cur&&known){
    if(r.version<=known.version)return;        // our own echo, or old news
    if(cardSig(cur)!==known.sig)return;         // we have an unsaved edit; saving will sort it out
  }
  const fresh=cardFromRow(r);
  if((r.assignee_id&&!teamName(r.assignee_id))||(r.reviewer_id&&!teamName(r.reviewer_id)))teamRefreshSoon();
  if(r.updated_at&&(!T.lastSeen||r.updated_at>T.lastSeen))T.lastSeen=r.updated_at;
  if(cur)Object.assign(cur,fresh);else S.cards.push(fresh);
  SYNC.last.set(r.id,{sig:cardSig(cur||fresh),version:r.version});
  renderSoon();
}
function addNote(n){
  if(T.notes.some(x=>x.id===n.id))return;
  T.notes.unshift(n);T.notes=T.notes.slice(0,40);
  renderTools();setTitle();
  if(n.kind!=='update')toast(n.message);
  if(!n.read_at)deskNotify(n);
}

/* ----- desktop notifications: a system pop-up while the board is open in a tab or window ----- */
const DESK_KEY='nudge.desktop';
function deskPref(){try{return localStorage.getItem(DESK_KEY)||'off';}catch(e){return 'off';}}
function setDeskPref(v){try{localStorage.setItem(DESK_KEY,v);}catch(e){}}
// 'unsupported' | 'denied' | 'off' | 'turn' (things that need me) | 'all'
function deskState(){
  if(!('Notification' in window))return 'unsupported';
  if(Notification.permission==='denied')return 'denied';
  if(Notification.permission!=='granted')return 'off';
  return deskPref();
}
const deskOn=()=>{const st=deskState();return st==='turn'||st==='all';};
async function enableDesk(mode){
  if(!('Notification' in window))return 'unsupported';
  let p=Notification.permission;
  if(p==='default'){try{p=await Notification.requestPermission();}catch(e){p='denied';}}
  if(p!=='granted')return p==='denied'?'denied':'off';
  setDeskPref(mode);return mode;
}
function deskNotify(n,force){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  if(!force){
    const st=deskState();
    if(st!=='turn'&&st!=='all')return;
    if(st==='turn'&&n.kind==='update')return;
    if(!document.hidden&&document.hasFocus())return;   // they are looking at the board: the toast is enough
  }
  try{
    const note=new Notification(S.name||'Nudge Board',{body:n.message,tag:'nudge-'+n.id});
    note.onclick=()=>{
      window.focus();note.close();
      if(n.card_id&&cardById(n.card_id)){if(dlg.open)dlg.close();openCard(n.card_id);}
      else if(T.ready)openNotes();
    };
  }catch(e){}
}
// "Show a test": say what happened. When the browser shows it but the computer hides it, the
// cause is almost always the computer's own notification settings for the browser, or Focus mode.
function deskTest(){
  const msg=$('#desk-msg'),say=(t,bad)=>{if(msg){msg.textContent=t;msg.className='hint'+(bad?' badline':'');}};
  if(!('Notification' in window)||Notification.permission!=='granted'){say('This browser has not allowed notifications for the board yet.',true);return;}
  if(location.protocol==='file:'){say('Notifications need the board on its web address, not opened as a file.',true);return;}
  let shown=false;
  try{
    const n=new Notification(S.name||'Nudge Board',{body:'Desktop notifications work. You will see one like this when a task lands with you.',tag:'nudge-test-'+Date.now()});
    n.onshow=()=>{shown=true;say('Sent. If it did not pop up, allow notifications for your browser in your computer\'s settings (Mac: System Settings › Notifications; Windows: Settings › System › Notifications) and turn off Focus or Do Not Disturb.');};
    n.onerror=()=>say('The browser could not show it. Check that notifications are allowed for this site.',true);
    n.onclick=()=>{window.focus();n.close();};
    setTimeout(()=>{if(!shown)say('Nothing was shown. Allow notifications for your browser in your computer\'s settings, and turn off Focus or Do Not Disturb.',true);},2500);
  }catch(e){say('This browser cannot show notifications from a page.',true);}
}
function deskHint(){
  const st=deskState();
  if(st==='unsupported')return '';
  if(st==='denied')return 'Desktop notifications are blocked for this site in your browser settings.';
  if(st==='off')return 'Get a desktop pop-up when a task lands with you.';
  return 'Desktop notifications are on in this browser.';
}
function deskSettingsHTML(){
  const st=deskState();
  if(st==='unsupported')return '<span class="hint">This browser cannot show desktop notifications.</span>';
  if(st==='denied')return '<span class="hint badline">Notifications are blocked for this site. Allow them in your browser\'s site settings (the icon left of the address), then reload the board.</span>';
  const opts=[['off','Off'],['turn','Things that need me (new task, QA, security, sent back, blocked)'],['all','Every update on my cards']];
  return '<div class="field"><label for="p-desk">Show a desktop pop-up for</label><select id="p-desk">'+
      opts.map(o=>'<option value="'+o[0]+'"'+(o[0]===st?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>'+
    '<span class="hint">They appear while the board is open in a tab or window, even in the background or minimised. While you are looking at the board you get the usual note at the bottom instead. This is set for this browser only.</span>'+
    (st!=='off'?'<div class="row"><button class="btn small" data-act="desk-test">Show a test</button><span class="hint" id="desk-msg" role="status"></span></div>':'');
}
function startLive(){
  try{
    T.unsub=B.subscribe({card:onRemoteCard,note:addNote,
      comment:p=>{const cid=(p.new&&p.new.card_id)||(p.old&&p.old.card_id);if(dlg.dataset.kind==='card'&&(!cid||cid===dlg.dataset.id))loadComments(dlg.dataset.id);},board:()=>{reloadAll().catch(()=>{});},status:st=>{
      const was=T.rt;T.rt=st==='SUBSCRIBED';
      if(T.rt&&!was&&T.rtEver)refreshTeam();     // reconnected: catch up on anything missed
      if(T.rt)T.rtEver=true;
    }});
  }catch(e){T.rt=false;}
  clearInterval(T.pollTimer);clearInterval(T.teamTimer);
  T.pollTimer=setInterval(()=>{pollOnce().catch(()=>{});},30000);
  T.teamTimer=setInterval(()=>{if(!document.hidden&&T.ready)refreshPeople().catch(()=>{});},5*60000);
}
async function pollOnce(){
  if(!T.ready||SYNC.run)return;
  if(document.hidden){
    // In the background only new notifications matter, and only when live updates are down
    if(!T.rt&&deskOn())await pollNotes();
    return;
  }
  const now=NOW();
  if(now-T.fullAt>(T.rt?15:5)*60000){await reloadAll();return;}   // also how removed cards are noticed
  if(T.rt)return;                                                 // live updates are arriving on their own
  const rows=await B.cardsSince(T.lastSeen);
  rows.forEach(r=>onRemoteCard({eventType:'UPDATE',new:r}));
  await pollNotes();
}
async function pollNotes(){
  const ns=await B.notesSince(T.noteSeen);
  ns.forEach(n=>{if(n.created_at>T.noteSeen)T.noteSeen=n.created_at;addNote(n);});
}
async function refreshTeam(){
  if(!T.ready)return;
  try{await B.rollIfDue();await reloadAll();}catch(e){}
}
async function refreshPeople(){
  const d=await B.loadPeople(isPM());
  T.team=d.team;T.people=d.people;
  S.cards.forEach(c=>{if(c.assigneeId)c.assignee=teamName(c.assigneeId);});
  renderAll();
}

function showSkeleton(){showGate(boardSkeletonHTML());$('#gate').classList.add('loading');}
function showGate(html){
  const g=$('#gate');g.classList.remove('loading');g.innerHTML=html;g.hidden=false;
  const w=$('.wrap');if(w)w.inert=true;
  const f=g.querySelector('input,button');if(f)f.focus();
}
function hideGate(){
  const g=$('#gate');g.hidden=true;g.innerHTML='';
  const w=$('.wrap');if(w)w.inert=false;
}
const gateShell=inner=>'<div class="gate-card"><span class="kicker">Nudge Board</span>'+inner+'</div>';
function friendlyAuthError(err){
  const m=(err&&err.message)||String(err);
  if(/invalid login credentials/i.test(m))return 'That email and password do not match. First time here, or forgot your password? Use a join code.';
  if(/email not confirmed/i.test(m))return 'Supabase still wants this email confirmed. Ask your project manager to switch off "Confirm email" (docs/SETUP.md, step 7).';
  if(/signups? not allowed|signup.*disabled/i.test(m))return 'New sign-ups are switched off in Supabase. Ask your project manager to switch them on (docs/SETUP.md, step 7).';
  if(/smtp|sending|confirmation/i.test(m))return 'Supabase tried to send a confirmation email. Ask your project manager to switch off "Confirm email" (docs/SETUP.md, step 7), then use the same code again.';
  // if(/expired|invalid|otp/i.test(m))return 'That code did not work. Check the digits, or ask for a new one.';   (email codes are paused)
  if(/rate|seconds|too many/i.test(m))return 'Too many tries. Wait a minute and try again.';
  return m;
}
function joinRefusal(r){
  const why=r&&r.reason;
  if(why==='locked')return 'Too many wrong tries for this code. Ask your project manager for a new one.';
  if(why==='server')return r.message;
  return 'That code does not match this email. Check both, or ask your project manager for a new code.';
}

$('#gate').addEventListener('click',e=>{
  const b=e.target.closest('[data-gate]');
  if(b&&b.type!=='submit')withBusy(b,()=>gateAction(b));   // submit buttons run through the form's submit event below
});
// Enter in a field, the phone keyboard's Go key, or the submit button: one path, and the page never reloads.
$('#gate').addEventListener('submit',e=>{
  e.preventDefault();
  const b=e.submitter||e.target.querySelector('[type=submit]');
  if(b&&!b.disabled)withBusy(b,()=>gateAction(b));
});
async function gateAction(b){
  const a=b.dataset.gate,msg=$('#g-msg');
  const say=(t,bad)=>{if(msg){msg.textContent=t;msg.className='hint'+(bad?' badline':'');}};
  const val=id=>{const el=$('#'+id);return el?el.value:'';};
  try{
    if(a==='google'){await B.signInGoogle();}
    else if(a==='signin'){
      const email=val('g-email').trim(),pw=val('g-pass');
      if(!isEmail(email)){say('Enter your email address.',true);return;}
      if(!pw){say('Enter your password.',true);return;}
      b.disabled=true;say('Signing in...');
      await B.signIn(email,pw);
      signedIn();
      await enterBoard();
    }else if(a==='join'){
      const email=val('g-email').trim(),code=val('g-code').trim(),pw=val('g-pass');
      if(!isEmail(email)){say('Enter your email address.',true);return;}
      if(!code){say('Enter the join code from your project manager.',true);return;}
      if(pw.length<8){say('Choose a password of at least 8 characters.',true);return;}
      b.disabled=true;T.joining=true;say('Checking your code...');
      try{
        const r=await B.startJoin(email,code);
        if(!r||!r.ok){b.disabled=false;say(joinRefusal(r),true);return;}
        say('Setting your password...');
        if(!await B.signUp(email,pw)){b.disabled=false;say('Supabase wants to confirm this email before it allows a password. Ask your project manager to switch off "Confirm email" (docs/SETUP.md, step 7), then use the same code again.',true);return;}
        const f=await B.finishJoin(code);
        if(!f||!f.ok){b.disabled=false;say(joinRefusal(f),true);return;}
      }finally{T.joining=false;}
      signedIn();
      await enterBoard();
    }else if(a==='finish'){
      const code=val('g-code').trim();
      if(!code){say('Enter the join code from your project manager.',true);return;}
      b.disabled=true;say('Checking your code...');
      const f=await B.finishJoin(code);
      if(!f||!f.ok){b.disabled=false;say(joinRefusal(f),true);return;}
      await enterBoard();
    }
    else if(a==='to-join'){showJoin('',val('g-email').trim());}
    else if(a==='to-signin'){showSignIn('',val('g-email').trim());}
    /* email codes (paused)
    else if(a==='send'){
      const email=$('#g-email').value.trim();
      if(!/^\S+@\S+\.\S+$/.test(email)){say('Enter your email address.',true);return;}
      b.disabled=true;say('Sending...');
      await B.sendCode(email);
      T.pendingEmail=email;$('#g-codebox').hidden=false;$('#g-code').focus();
      say('Check your inbox for the code. It can take a minute.');

async function bootTeam(){
  T.on=true;
  showSkeleton();
  try{
    B=window.NUDGE_BACKEND||makeSupabaseBackend(CFG);
    await B.init();
  }catch(e){
    showGate(gateShell('<h1>Cannot reach the server</h1><p class="muted">'+esc(e.message||String(e))+'</p><button class="btn primary big" data-gate="reload">Try again</button>'));
    return;
  }
  if(/^#mute=/.test(location.hash)){await handleMuteLink();return;}
  B.onAuth((ev)=>{
    if(ev==='SIGNED_OUT'&&T.ready)location.reload();
    else if(ev==='SIGNED_IN'&&!T.ready&&!T.booting&&!T.joining)enterBoard();
  });
  const sess=await B.session();
  if(!sess){showSignIn();return;}
  await enterBoard();
}
async function enterBoard(){
  if(T.booting||T.ready)return;
  T.booting=true;
  showSkeleton();
  try{
    const sess=await B.session();
    const me=await B.whoami();
    if(!me){
      showGate(gateShell('<h1>Not on the team yet</h1><p class="muted">You are signed in as <b>'+esc(sess?sess.email:'')+'</b>, but this sign-in is not linked to the board. If your project manager gave you a join code, enter it here. If not, ask them to add your email.</p>'+
        '<form method="post" action="#" novalidate><div class="field"><label for="g-code">Join code</label><input id="g-code" name="join-code" class="mono" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="K7PM-3QXD"></div>'+
        '<button type="submit" class="btn primary big" data-gate="finish">Join the board</button>'+
        '<p id="g-msg" class="hint" role="status" aria-live="polite"></p></form>'+
        '<div class="alt"><button type="button" class="btn link" data-gate="signout">Sign out</button></div>'));
      T.booting=false;return;
    }
    T.me=me;
    if(me.timezone!==T.tz){try{T.me=(await B.updateMyPrefs(null,T.tz,null))||me;}catch(e){}}
    try{await B.rollIfDue();}catch(e){}
    applyLoaded(await B.loadAll(T.me.role==='pm'));
    T.ready=true;T.fullAt=NOW();T.lastPoll=NOW();
    hideGate();renderAll();startLive();openDeepLink();
  }catch(e){
    console.error(e);
    showGate(gateShell('<h1>Something went wrong</h1><p class="muted">'+esc(e.message||String(e))+'</p><button class="btn primary big" data-gate="reload">Try again</button><button class="btn big" data-gate="signout">Sign out</button>'));
  }
  T.booting=false;
}
async function handleMuteLink(){
  const m=location.hash.match(/^#mute=([0-9a-f-]{36})&mode=(pause|calm|off)/i);
  history.replaceState(null,'',location.pathname+location.search);
  if(!m){
    showGate(gateShell('<h1>That link looks incomplete</h1><p class="muted">Open the board and use Settings to change your emails.</p><button class="btn primary big" data-gate="reload">Open the board</button>'));
    return;
  }
  const mode=m[2].toLowerCase();
  const label={pause:'Pause emails until Monday?',calm:'Switch to one digest each weekday morning?',off:'Turn emails off?'}[mode];
  showGate(gateShell('<h1>'+label+'</h1><p class="muted">You will still see every update in the board.</p>'+
    '<button class="btn primary big" data-gate="mute" data-token="'+esc(m[1])+'" data-mode="'+mode+'">Yes, do that</button>'+
    '<button class="btn big" data-gate="reload">No, open the board</button><p id="g-msg" class="hint" role="status"></p>'));
}
async function applyMute(token,mode){
  let html;
  try{
    const r=await B.mute(token,mode);
    if(!r||!r.ok)html='<h1>That link no longer works</h1><p class="muted">Open the board and use Settings to change your emails.</p>';
    else html='<h1>Done, '+esc(r.name)+'</h1><p class="muted">'+({pause:'No emails until Monday. You will still see updates in the board.',
      calm:'You will get one short digest each weekday morning, and no other emails.',off:'Emails are off. You will still see updates in the board.'})[r.mode]+'</p>';
  }catch(e){html='<h1>Could not save that</h1><p class="muted">'+esc(e.message||String(e))+'</p>';}
  showGate(gateShell(html+'<button class="btn primary big" data-gate="reload">Open the board</button>'));
}
function openDeepLink(){
  const m=location.hash.match(/^#card=(\d+)/);
  if(!m)return;
  const c=S.cards.find(x=>x.num===+m[1]);
  history.replaceState(null,'',location.pathname+location.search);
  if(c)openCard(c.id);else toast('That card is not on the board any more. It may have been archived.');
}

// An address that only opens on one computer (a file, localhost): useless in an email to anyone else
const isLocalUrl=u=>/^(file:|https?:\/\/(localhost|127\.|0\.0\.0\.0|\[::1\])|https?:\/\/[^\/]*\.local\b)/i.test(String(u||'').trim());
// The board's public address: what was saved, else config.js, else wherever this page is.
// A local address saved by an earlier version (opened from this computer) gives way to config.js.
const boardUrl=s=>{
  const saved=s&&s.app_url;
  if(saved&&!(isLocalUrl(saved)&&CFG.appUrl))return saved;
  return CFG.appUrl||(location.origin+location.pathname);
};
// PM: make sure the address saved for emails is the public one. Fixes a missing or local address
// with the one in config.js, so "Open the board" in emails goes to the hosted board.
async function ensureBoardUrl(s){
  if(!s||!CFG.appUrl||isLocalUrl(CFG.appUrl))return;
  if(s.app_url&&!isLocalUrl(s.app_url))return;
  try{await B.updateSettings({app_url:CFG.appUrl,updated_at:new Date().toISOString()});s.app_url=CFG.appUrl;}catch(e){}
}
// Before saving: refuse an address only this computer can open
function badBoardUrl(u){
  if(isLocalUrl(u))return 'That address only works on this computer, so links in emails would not open for anyone else. Use the address where the board is hosted'+(CFG.appUrl&&!isLocalUrl(CFG.appUrl)?', like '+CFG.appUrl:'')+'.';
  return '';
}

    const target=$('#prows .prow[data-pid="'+keep.pid+'"] '+(keep.f?'[data-f="'+keep.f+'"]':'[data-act="'+keep.act+'"]'));
    if(target)target.focus();
  }
}
function teamDialogChange(e){
  const el=e.target,id=el.id,kind=dlg.dataset.kind;
  if(kind==='team'){
    const row=el.closest&&el.closest('.prow');
    if(row&&el.dataset.f){
      const f=el.dataset.f;let v=el.type==='checkbox'?el.checked:el.value;
      if(f==='email')v=v.trim().toLowerCase();if(f==='name')v=v.trim();
      el.disabled=true;   // one change at a time per field
      (async()=>{
        let failed=false;
        try{await B.updatePerson(row.dataset.pid,{[f]:v});}catch(err){failed=true;toast((err.message||'That change did not save.')+' It was put back.');}
        finally{el.disabled=false;}
        try{await refreshPeople();}catch(err){}
        if(failed||f==='role'||f==='active'||f==='email')rerenderPeople();
        if(row.dataset.pid===T.me.id){
          try{T.me=(await B.whoami())||T.me;}catch(err){}
          if(!isPM()){dlg.close();reloadAll({discard:true}).catch(()=>{});}
          renderTools();
        }
      })();
      return true;
    }
    if(id==='e-enabled'){
      (async()=>{
        const m=$('#e-msg'),patch=Object.assign(emailPatch(),{emails_enabled:el.checked});
        el.disabled=true;if(m){m.textContent='Saving…';m.className='hint';}
        if(el.checked&&patch.provider!=='log'&&!patch.app_url){el.checked=false;el.disabled=false;if(m){m.textContent='Enter the board web address first.';m.className='hint badline';}return;}
        const urlErr=badBoardUrl(patch.app_url);
        if(urlErr){el.checked=!el.checked;el.disabled=false;if(m){m.textContent=urlErr;m.className='hint badline';}return;}
        try{await B.updateSettings(patch);Object.assign(T.settings,patch);if(m){m.textContent=el.checked?'Emails are on. Settings saved.':'Emails are off. Settings saved.';m.className='hint okline';}}
        catch(err){el.checked=!el.checked;if(m){m.textContent=err.message||'Could not change that.';m.className='hint badline';}}
        finally{el.disabled=false;}
      })();
      return true;
    }
  }
  if(kind==='settings'){
    if(id==='p-mode'){
      const before=T.me.notify_mode;el.disabled=true;
      (async()=>{
        try{T.me=await B.updateMyPrefs(el.value,null,null)||T.me;toast('Saved.');}
        catch(err){el.value=before;toast((err.message||'Could not save.')+' Nothing changed.');}
        finally{el.disabled=false;}
      })();
      return true;
    }
    if(id==='p-desk'){
      const want=el.value;
      (async()=>{
        const st=want==='off'?(setDeskPref('off'),'off'):await enableDesk(want);
        const box=$('#desk');if(box)box.innerHTML=deskSettingsHTML();
        toast(st===want?(want==='off'?'Desktop notifications are off.':'Desktop notifications are on.'):st==='denied'?'The browser blocked notifications. Allow them in its site settings.':'Notifications were not allowed.');
      })();
      return true;
    }
    if(id==='s-btz'){S.timezone=el.value.trim()||'UTC';commit();return true;}
  }
  return false;
}
function teamDialogClick(kind,a,act,e){
  if(kind==='notes'){
    if(a==='desk-on'){
      withBusy(act,()=>enableDesk('turn')).then(st=>{
        if(st===undefined)return;   // a second click while the first was still asking
        if(dlg.dataset.kind==='notes')openDialog('notes',notesHTML());
        toast(st==='turn'?'Desktop notifications are on. Change them in Settings.':st==='denied'?'The browser blocked notifications. Allow them in its site settings.':'Notifications were not allowed.');
      });
      return true;
    }
    const n=e.target.closest('.note');
    if(n&&n.dataset.card&&cardById(n.dataset.card)){dlg.close();openCard(n.dataset.card);return true;}
    return false;
  }
  if(kind==='team'){
    if(a==='team-add'){
      const name=$('#t-name').value.trim(),email=$('#t-email').value.trim().toLowerCase(),role=$('#t-role').value,m=$('#t-msg');
      if(!name||!/^\S+@\S+\.\S+$/.test(email)){m.textContent='Enter a name and a work email.';m.className='hint badline';return true;}
      withBusy(act,async()=>{
        try{
          await B.insertPerson({name,email,role,timezone:T.tz});
          $('#t-name').value='';$('#t-email').value='';
          await refreshPeople();rerenderPeople();
          const np=(T.people||[]).find(x=>x.email===email);
          m.textContent=np&&np.join_code?name+'\'s join code is '+fmtCode(np.join_code)+'. Send it to them, with the board address, so they can set a password.':name+' is on the team.';m.className='hint okline';
        }catch(err){m.textContent=/duplicate|unique/i.test(err.message||'')?'That email is already on the team.':(err.message||'Could not add that person.');m.className='hint badline';}
      });
      return true;
    }
    if(a==='team-del'){
      const id=act.dataset.pid;
      if(T.armed!==id){T.armed=id;rerenderPeople();return true;}
      T.armed=null;
      withBusy(act,async()=>{try{await B.deletePerson(id);}catch(err){toast(err.message||'Could not remove that person.');}try{await refreshPeople();rerenderPeople();}catch(err){}});
      return true;
    }
    if(a==='team-copycode'){
      copyText(act.dataset.code).then(ok=>{act.textContent=ok?'Copied':'Select and copy';setTimeout(()=>{act.textContent='Copy code';},1400);});
      return true;
    }
    if(a==='team-reset'){
      const id=act.dataset.pid,p=(T.people||[]).find(x=>x.id===id);
      if(T.armedReset!==id){T.armedReset=id;rerenderPeople();return true;}
      T.armedReset=null;
      withBusy(act,async()=>{
        try{
          const code=await B.resetJoinCode(id);
          await refreshPeople();rerenderPeople();
          const m=$('#t-msg');
          if(m){m.textContent='New join code for '+(p?p.name:'them')+': '+fmtCode(code)+'. Their old password no longer opens the board.'+(id===T.me.id?' You will need this code to sign in again.':'');m.className='hint okline';}
        }catch(err){toast(err.message||'Could not reset that.');}
      });
      return true;
    }
    if(a==='copy-claude-key'){
      copyText((T.status&&T.status.claude_key)||'').then(ok=>{act.textContent=ok?'Copied':'Select and copy';setTimeout(()=>{act.textContent='Copy key';},1400);});
      return true;
    }
    if(a==='team-save'){
      const m=$('#e-msg');
      const patch=emailPatch();
      const urlErr=badBoardUrl(patch.app_url);
      if(urlErr){m.textContent=urlErr;m.className='hint badline';$('#e-appurl').focus();return true;}
      withBusy(act,async()=>{
        try{await B.updateSettings(patch);Object.assign(T.settings,patch);m.textContent='Saved.';m.className='hint okline';}
        catch(err){m.textContent=err.message||'Could not save.';m.className='hint badline';}
      });
      return true;
    }
    if(a==='team-test'){
      const m=$('#e-msg');m.textContent='Sending…';m.className='hint';
      withBusy(act,async()=>{
        try{
          const r=await B.sendTestEmail();
          m.textContent=r.message;m.className='hint '+(r.ok?'okline':'badline');
          setTimeout(async()=>{try{T.status=await B.emailStatus();const st=$('#e-status');if(dlg.dataset.kind==='team'&&st)st.innerHTML=statusHTML();}catch(err){}},70000);
        }catch(err){m.textContent=err.message||'Could not send.';m.className='hint badline';}
      });
      return true;
    }
  }
  if(kind==='settings'){
    if(a==='pause-monday'||a==='resume'){
      withBusy(act,async()=>{try{T.me=await B.updateMyPrefs(null,null,a==='resume'?'clear':'monday')||T.me;openDialog('settings',settingsHTML());$('#s-export')&&($('#s-export').value=exportText());}catch(err){toast(err.message||'Could not save.');}});
      return true;
    }
    if(a==='sign-out'){withBusy(act,async()=>{try{await B.signOut();}catch(err){}location.reload();});return true;}
    if(a==='desk-test'){withBusy(act,()=>new Promise(r=>{deskTest();setTimeout(r,2600);}));return true;}
    if(a==='away-save'||a==='away-clear'){
      const v=a==='away-clear'?null:($('#p-away').value||null);
      withBusy(act,async()=>{
        try{T.me=await B.setMyAway(v)||T.me;await refreshPeople();openDialog('settings',settingsHTML());toast(v?'Saved. The team can see you are away.':'Welcome back.');}
        catch(err){toast(err.message||'Could not save that.');}
      });
      return true;
    }
    if(a==='change-pass'){
      const pw=$('#p-newpass').value,m=$('#p-passmsg');
      if(pw.length<8){m.textContent='Use at least 8 characters.';m.className='hint badline';return true;}
      withBusy(act,async()=>{
        try{await B.changePassword(pw);$('#p-newpass').value='';m.textContent='Password changed.';m.className='hint okline';}
        catch(err){m.textContent=/reauthenticat|nonce/i.test(err.message||'')?'Supabase asks for an email check before a password change. Ask your project manager for a new join code instead.':(err.message||'Could not change the password.');m.className='hint badline';}
      });
      return true;
    }
    if(a==='roll-now'){
      withBusy(act,async()=>{try{await B.rollNow();await reloadAll();toast('New cycle started. Unfinished cards rolled over.');dlg.close();}catch(err){toast(err.message||'Could not start a new cycle.');}});
      return true;
    }
    if(a==='copy-export'){
      copyText($('#s-export').value).then(ok=>{act.lastChild.textContent=ok?'Copied':'Select and copy';setTimeout(()=>{act.lastChild.textContent='Copy card list';},1400);});
      $('#s-export').select();return true;
    }
  }
  return false;
}

/* ---------- tooltips: anything with data-tip, on hover or keyboard focus ---------- */
const tipEl=document.createElement('div');tipEl.className='tip';tipEl.setAttribute('role','tooltip');tipEl.id='tip';tipEl.hidden=true;
document.body.appendChild(tipEl);
let tipTimer=null;
function showTip(el,ms){
  const t=el.dataset.tip;if(!t)return;
  clearTimeout(tipTimer);tipTimer=null;
  tipEl.innerHTML=t.split('\n').map((l,i)=>i?'<span>'+esc(l)+'</span>':'<b>'+esc(l)+'</b>').join('');
  tipEl.hidden=false;
  const r=el.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;
  let x=r.left+r.width/2-w/2,y=r.bottom+8;
  x=Math.max(8,Math.min(x,innerWidth-w-8));
  if(y+h>innerHeight-8)y=r.top-h-8;
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';
  el.setAttribute('aria-describedby','tip');
  if(ms)tipTimer=setTimeout(hideTip,ms);
}
function hideTip(){tipEl.hidden=true;clearTimeout(tipTimer);tipTimer=null;}
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('mouseout',e=>{
  const from=e.target.closest&&e.target.closest('[data-tip]'),to=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('[data-tip]');
  if(from&&from!==to&&!tipTimer)hideTip();
});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&el.matches(':focus-visible'))showTip(el);else if(!tipTimer)hideTip();});
document.addEventListener('focusout',()=>{if(!tipTimer)hideTip();});
document.addEventListener('scroll',hideTip,true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!tipEl.hidden)hideTip();});

/* ---------- show / hide a password while typing it ---------- */
const pwField=(id,name,auto,extra)=>'<div class="pw"><input id="'+id+'" name="'+name+'" type="password" autocomplete="'+auto+'" autocapitalize="none" spellcheck="false"'+(extra||'')+'>'+
  '<button type="button" class="pw-eye" data-pwtoggle="'+id+'" aria-controls="'+id+'" aria-pressed="false" aria-label="Show password">'+ic('eye')+'</button></div>';
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-pwtoggle]');if(!b)return;
  const inp=document.getElementById(b.dataset.pwtoggle);if(!inp)return;
  const show=inp.type==='password';
  inp.type=show?'text':'password';
  b.setAttribute('aria-pressed',String(show));b.setAttribute('aria-label',show?'Hide password':'Show password');
  b.innerHTML=ic(show?'eyeoff':'eye');
  inp.focus({preventScroll:true});
});
// Hide a shown password again before the form goes, so the browser saves it as a password
document.addEventListener('submit',()=>{$$('.pw input[type=text]').forEach(i=>{i.type='password';});},true);

/* ---------- boot ---------- */
const narrow=window.matchMedia('(max-width:640px)');
const setPlaceholder=()=>{$('#add').placeholder=narrow.matches?'Add a task, e.g. Fix login fri !high':'Add a task: Fix login timeout fri !high @sam #auth';};
setPlaceholder();
if(narrow.addEventListener)narrow.addEventListener('change',setPlaceholder);
if(TEAM_CONFIGURED){
  S=blankState();S.cards=[];
  bootTeam();
}else{
  S=load()||sampleState();
  const rolled=autoRoll();
  save();
  renderAll();
  if(rolled)toast('Cycle '+S.cycle.n+' started. '+rolled.done+' done archived, '+rolled.rolled+' rolled over.');
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){T.hiddenAt=NOW();return;}
  if(T.on){if(T.ready&&NOW()-(T.hiddenAt||NOW())>5*60000)refreshTeam();return;}
  const r=autoRoll();
  if(r){save();toast('Cycle '+S.cycle.n+' started. '+r.done+' done archived, '+r.rolled+' rolled over.');}
  if(!dlg.open)renderAll();
});
window.addEventListener('offline',()=>{if(T.on){setSyncState('offline');renderNotices();}});
window.addEventListener('online',()=>{if(T.on&&T.ready){setSyncState('');renderNotices();pushChanges().then(refreshTeam);}});
window.addEventListener('hashchange',()=>{if(T.on&&T.ready)openDeepLink();});
})();
